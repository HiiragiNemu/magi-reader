name: Apply ordinal manual batches with embedded-source fallback

on:
  push:
    branches:
      - reader/manual-gpt-retranslation-20260816
    paths:
      - manual_retranslation/manual_batches/*.json
      - .github/workflows/manual-retranslation-ordinal-apply-fallback.yml

permissions:
  contents: write

concurrency:
  group: robust-manual-retranslation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply all reviewed ordinal batches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import json
          import re
          from pathlib import Path

          ALLOWED = {
              'textLeft', 'textRight', 'textCenter', 'narration',
              'progressNarration', 'textSelect', 'nameLeft', 'nameRight',
              'nameCenter', 'nameNarration',
          }
          TAG_RE = re.compile(r'\[[^\]\r\n]+\]')
          BRACE_RE = re.compile(r'\{[^{}\r\n]+\}')
          PRINTF_RE = re.compile(r'%(?:\d+\$)?[-+#0 .\d]*[A-Za-z]')
          target_root = Path('magireco-translate-data-master/Scenarios_full')
          source_roots = [
              Path('magireco-source-master/Scenarios_full'),
              Path('magireco-source-master'),
              Path('source/Scenarios_full'),
          ]

          def load(path):
              with path.open(encoding='utf-8-sig') as f:
                  return json.load(f)

          def fields(node, path=()):
              out = []
              if isinstance(node, dict):
                  for key, value in node.items():
                      p = path + (key,)
                      if key in ALLOWED:
                          if not isinstance(value, str):
                              raise AssertionError(f'non-string text field at {p!r}')
                          out.append((p, value))
                      else:
                          out.extend(fields(value, p))
              elif isinstance(node, list):
                  for index, value in enumerate(node):
                      out.extend(fields(value, path + (index,)))
              return out

          def assign(node, path, value):
              cur = node
              for part in path[:-1]:
                  cur = cur[part]
              cur[path[-1]] = value

          def validate_non_text(before, after, path=()):
              if type(before) is not type(after):
                  raise AssertionError(f'type changed at {path!r}')
              if isinstance(before, dict):
                  if list(before.keys()) != list(after.keys()):
                      raise AssertionError(f'keys changed at {path!r}')
                  for key in before:
                      if key not in ALLOWED:
                          validate_non_text(before[key], after[key], path + (key,))
              elif isinstance(before, list):
                  if len(before) != len(after):
                      raise AssertionError(f'length changed at {path!r}')
                  for index, (left, right) in enumerate(zip(before, after)):
                      validate_non_text(left, right, path + (index,))
              elif before != after:
                  raise AssertionError(f'non-text value changed at {path!r}')

          reports = []
          total_changed_files = 0
          total_changed_fields = 0

          for batch_path in sorted(Path('manual_retranslation/manual_batches').glob('*.json')):
              batch = load(batch_path)
              if batch.get('schema_version') != 1:
                  raise AssertionError(f'unsupported schema: {batch_path}')
              for story in batch.get('stories', []):
                  story_id = str(story['story_id'])
                  rel = Path(story['relative_path'])
                  target_path = target_root / rel
                  if not target_path.is_file():
                      raise FileNotFoundError(target_path)
                  target = load(target_path)
                  before = copy.deepcopy(target)
                  target_fields = fields(target)
                  entries = story['entries']
                  if len(entries) != len(target_fields):
                      raise AssertionError(
                          f'field count mismatch for {rel}: {len(entries)} != {len(target_fields)}'
                      )

                  source_path = next((root / rel for root in source_roots if (root / rel).is_file()), None)
                  source_fields = fields(load(source_path)) if source_path else None
                  if source_fields is not None:
                      if [p for p, _ in source_fields] != [p for p, _ in target_fields]:
                          raise AssertionError(f'Japanese/Chinese field paths differ for {rel}')

                  changed = 0
                  for ordinal, (entry, (path, old_cn)) in enumerate(zip(entries, target_fields), 1):
                      if entry.get('ordinal') != ordinal:
                          raise AssertionError(f'ordinal mismatch for {rel} at {ordinal}')
                      jp = entry.get('jp')
                      zh = entry.get('zh_cn')
                      if not isinstance(jp, str) or not isinstance(zh, str):
                          raise AssertionError(f'invalid text at {rel} ordinal {ordinal}')
                      if source_fields is not None and source_fields[ordinal - 1][1] != jp:
                          raise AssertionError(
                              f'Japanese mismatch for {rel} ordinal {ordinal}: '
                              f'{source_fields[ordinal - 1][1]!r} != {jp!r}'
                          )
                      if jp.count('@') != zh.count('@'):
                          raise AssertionError(f'@ count changed for {rel} ordinal {ordinal}')
                      if TAG_RE.findall(jp) != TAG_RE.findall(zh):
                          raise AssertionError(f'control tags changed for {rel} ordinal {ordinal}')
                      if BRACE_RE.findall(jp) != BRACE_RE.findall(zh):
                          raise AssertionError(f'brace tokens changed for {rel} ordinal {ordinal}')
                      if PRINTF_RE.findall(jp) != PRINTF_RE.findall(zh):
                          raise AssertionError(f'printf tokens changed for {rel} ordinal {ordinal}')
                      if old_cn != zh:
                          assign(target, path, zh)
                          changed += 1

                  validate_non_text(before, target, (str(rel),))
                  if changed:
                      target_path.write_text(
                          json.dumps(target, ensure_ascii=False, indent=2) + '\n',
                          encoding='utf-8',
                      )
                      load(target_path)
                      total_changed_files += 1
                      total_changed_fields += changed
                  reports.append({
                      'batch_id': batch['batch_id'],
                      'story_id': story_id,
                      'relative_path': rel.as_posix(),
                      'source_verified': source_fields is not None,
                      'field_count': len(entries),
                      'changed_fields': changed,
                  })

          report = {
              'schema_version': 1,
              'stories': reports,
              'changed_files': total_changed_files,
              'changed_fields': total_changed_fields,
          }
          Path('manual_retranslation/last_ordinal_fallback_report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(report, ensure_ascii=False))
          PY

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'magi-reader translation bot'
          git config user.email 'actions@users.noreply.github.com'
          git add magireco-translate-data-master/Scenarios_full manual_retranslation/last_ordinal_fallback_report.json
          if git diff --cached --quiet; then
            echo 'All reviewed ordinal batches are already present.'
            exit 0
          fi
          git commit -m 'Apply validated ordinal manual translations'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
