name: Materialize TW Official Simplified Chinese into main

on:
  repository_dispatch:
    types: [exedra_tw_source_v1]
  workflow_dispatch:
    inputs:
      release_url:
        description: Canonical immutable TW v1 Release page
        required: true
        type: string
      archive_url:
        description: Canonical immutable TW v1 ZIP URL
        required: true
        type: string
      archive_sha256:
        description: Required ZIP SHA-256
        required: true
        type: string
      contract_url:
        description: Canonical immutable TW v1 contract URL
        required: true
        type: string
      contract_sha256:
        description: Required contract SHA-256
        required: true
        type: string
      sp_revision:
        required: true
        type: string
      scenario_revision:
        required: true
        type: string
      manifest_revision:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: materialize-exedra-official-main
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || vars.EXEDRA_READER_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      source_ref: ${{ steps.commit.outputs.source_ref }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve and validate immutable producer event
        id: source
        env:
          INPUT_RELEASE_URL: ${{ inputs.release_url }}
          INPUT_ARCHIVE_URL: ${{ inputs.archive_url }}
          INPUT_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          INPUT_CONTRACT_URL: ${{ inputs.contract_url }}
          INPUT_CONTRACT_SHA256: ${{ inputs.contract_sha256 }}
          INPUT_SP_REVISION: ${{ inputs.sp_revision }}
          INPUT_SCENARIO_REVISION: ${{ inputs.scenario_revision }}
          INPUT_MANIFEST_REVISION: ${{ inputs.manifest_revision }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/resolve_reader_update_event.py tw \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" \
            --github-output "$GITHUB_OUTPUT" \
            --release-url "$INPUT_RELEASE_URL" \
            --archive-url "$INPUT_ARCHIVE_URL" \
            --archive-sha256 "$INPUT_ARCHIVE_SHA256" \
            --contract-url "$INPUT_CONTRACT_URL" \
            --contract-sha256 "$INPUT_CONTRACT_SHA256" \
            --sp-revision "$INPUT_SP_REVISION" \
            --scenario-revision "$INPUT_SCENARIO_REVISION" \
            --manifest-revision "$INPUT_MANIFEST_REVISION"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Require private producer access token
        env:
          EXEDRA_WIKI_SOURCE_TOKEN: ${{ secrets.EXEDRA_WIKI_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXEDRA_WIKI_SOURCE_TOKEN" || {
            echo "::error::EXEDRA_WIKI_SOURCE_TOKEN is required for the private producer repository."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-compile -r requirements-data-tools.txt
          npm --prefix website ci
          python - <<'PY'
          from tools.tw_official_import_core import simplified_converter
          convert = simplified_converter()
          probe = '繁體中文與臺灣檔案'
          result = convert(probe)
          if result == probe or any(char in result for char in ('體', '臺', '檔')):
              raise SystemExit(f'OpenCC tw2sp self-check failed: {probe!r} -> {result!r}')
          print(f'OPENCC_TW2SP_READY {probe!r} -> {result!r}')
          PY

      - name: Download authenticated immutable Release asset
        env:
          GH_TOKEN: ${{ secrets.EXEDRA_WIKI_SOURCE_TOKEN }}
          SOURCE_REPOSITORY: ${{ steps.source.outputs.source_repository }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          ASSET_NAME: ${{ steps.source.outputs.asset_name }}
          ARCHIVE_SHA256: ${{ steps.source.outputs.archive_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/tw-sp-bundle"
          archive="$RUNNER_TEMP/$ASSET_NAME"
          rm -rf "$bundle" "$archive"
          gh release download "$RELEASE_TAG" \
            --repo "$SOURCE_REPOSITORY" \
            --pattern "$ASSET_NAME" \
            --dir "$RUNNER_TEMP"
          python tools/fetch_tw_sp_source_bundle.py \
            --archive "$archive" \
            --source-sha256 "$ARCHIVE_SHA256" \
            --output-root "$bundle"

      - name: Verify contract and producer revision pins
        env:
          CONTRACT_SHA256: ${{ steps.source.outputs.contract_sha256 }}
          SP_REVISION: ${{ steps.source.outputs.sp_revision }}
          SCENARIO_REVISION: ${{ steps.source.outputs.scenario_revision }}
          MANIFEST_REVISION: ${{ steps.source.outputs.manifest_revision }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_tw_source_pin.py \
            --bundle-root "$RUNNER_TEMP/tw-sp-bundle" \
            --contract-sha256 "$CONTRACT_SHA256" \
            --sp-revision "$SP_REVISION" \
            --scenario-revision "$SCENARIO_REVISION" \
            --manifest-revision "$MANIFEST_REVISION"

      - name: Materialize authentic TW JSON and canonical Simplified Chinese
        shell: bash
        run: |
          set -euo pipefail
          python tools/materialize_tw_official_cn.py \
            --source-bundle-root "$RUNNER_TEMP/tw-sp-bundle" \
            --source-provider exedra-wiki-sp \
            --skip-derived

          python generate_story_index.py
          python tools/apply_tw_official_metadata.py
          python generate_machine_translation_manifest.py \
            --translation-base 65f221f2aaa5a9fe161ed32e03e4dfbb93d4746d \
            --translation-commit 3d463befe7a10d4cb72034378ce2a6f23c377abb
          python tools/build_split_search_indexes.py
          python tools/build_split_search_indexes.py --validate-only

      - name: Certify dynamic TW coverage and published metadata
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_tw_official_coverage.py \
            --scenario-root "$RUNNER_TEMP/tw-sp-bundle/bundle/Resources/Scenarios"
          python tools/certify_tw_materialization.py \
            --report artifacts/exedra_official_tw_import_report.json \
            --story-index website/public/story_index.json

      - name: Run complete tests and Cloudflare build verification
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py'
          npm --prefix website run check
          python generate_story_index.py --validate-only
          python tools/search_chunk_delivery.py materialize
          python tools/search_chunk_delivery.py verify-tree --root website/public
          npm --prefix website run build:worker
          npm --prefix website run verify:cloudflare-output
          python tools/search_chunk_delivery.py verify-tree --root website/.open-next/assets

      - name: Commit certified materialization to main
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tw-official-source
          rm -rf website/.magi-reader-generation-backups
          git config user.name 'Hiiragi Nemu'
          git config user.email '128921071+HiiragiNemu@users.noreply.github.com'
          python tools/stage_reader_automation_update.py tw
          if git diff --cached --quiet; then
            echo 'Certified materialization produced no repository changes.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m '[tw-materialized] Import immutable official TW v1 source'
          source_ref="$(git rev-parse HEAD)"
          git push origin HEAD:main
          remote_ref="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_ref" = "$source_ref" || {
            echo "::error::origin/main $remote_ref differs from committed $source_ref"
            exit 1
          }
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

  deploy:
    needs: materialize
    if: needs.materialize.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      pages_branch: main
      source_ref: ${{ needs.materialize.outputs.source_ref }}
    secrets: inherit
