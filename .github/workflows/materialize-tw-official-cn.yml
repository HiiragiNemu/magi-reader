name: Materialize TW Official Simplified Chinese into EXEDRA-TEST

on:
  push:
    branches: [EXEDRA-TEST]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-tw-official-cn-exedra-test
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!startsWith(github.event.head_commit.message, '[tw-materialized]') &&
       !startsWith(github.event.head_commit.message, '[tw-status]'))
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: EXEDRA-TEST

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Materialize, validate and build
        id: materialize
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          bash -euo pipefail <<'BUILD' 2>&1 | tee "$RUNNER_TEMP/tw-materialization.log"
          mkdir -p \
            .tw-official-source/scenarios \
            .tw-official-source/manifests \
            .tw-official-source/normalized

          python - <<'PY'
          import base64
          import json
          import lzma
          import re
          from collections import defaultdict
          from pathlib import Path

          roots = [
              Path('sources/tw-official-zh-cn'),
              Path('sources/tw-official-zh-cn-v3'),
              Path('sources/tw-official-zh-cn-valid'),
          ]
          target = Path('.tw-official-source/normalized')
          pattern = re.compile(r'^(?P<prefix>.+\.xz\.b64)\.part(?P<number>\d+)$')
          scenario = None
          names = None
          diagnostics = []

          def canonical_decode(text):
              value = ''.join(text.split()).rstrip('=')
              value += '=' * ((-len(value)) % 4)
              return base64.b64decode(value, validate=True)

          for root in roots:
              if not root.is_dir():
                  continue
              groups = defaultdict(list)
              for path in root.glob('*.part*'):
                  match = pattern.fullmatch(path.name)
                  if match:
                      groups[match.group('prefix')].append(
                          (int(match.group('number')), path)
                      )
              for prefix, parts in sorted(groups.items()):
                  ordered = [path for _number, path in sorted(parts)]
                  numbers = [number for number, _path in sorted(parts)]
                  if numbers != list(range(1, len(numbers) + 1)):
                      diagnostics.append(
                          f'SKIP non-contiguous {root}/{prefix}: {numbers}'
                      )
                      continue
                  texts = [path.read_text(encoding='ascii') for path in ordered]
                  binary_candidates = []
                  try:
                      binary_candidates.append((
                          'joined-unpadded',
                          canonical_decode(''.join(text.rstrip().rstrip('=') for text in texts)),
                      ))
                  except Exception as exc:
                      diagnostics.append(f'{root}/{prefix} joined-unpadded base64: {exc}')
                  try:
                      binary_candidates.append((
                          'independent-parts',
                          b''.join(canonical_decode(text) for text in texts),
                      ))
                  except Exception as exc:
                      diagnostics.append(f'{root}/{prefix} independent base64: {exc}')
                  if len(texts) == 1:
                      try:
                          binary_candidates.append((
                              'single-part',
                              canonical_decode(texts[0]),
                          ))
                      except Exception as exc:
                          diagnostics.append(f'{root}/{prefix} single base64: {exc}')

                  seen = set()
                  for strategy, compressed in binary_candidates:
                      marker = (len(compressed), compressed[:32], compressed[-32:])
                      if marker in seen:
                          continue
                      seen.add(marker)
                      try:
                          raw = lzma.decompress(compressed)
                          value = json.loads(raw.decode('utf-8'))
                      except Exception as exc:
                          diagnostics.append(
                              f'{root}/{prefix} {strategy}: invalid xz/json: {exc}'
                          )
                          continue
                      if not isinstance(value, dict):
                          diagnostics.append(
                              f'{root}/{prefix} {strategy}: top-level is not object'
                          )
                          continue
                      files = value.get('files')
                      titles = value.get('titles')
                      diagnostics.append(
                          f'VALID {root}/{prefix} {strategy} '
                          f'keys={sorted(value)[:8]} '
                          f'files={len(files) if isinstance(files, dict) else 0} '
                          f'titles={len(titles) if isinstance(titles, dict) else 0}'
                      )
                      if (
                          scenario is None
                          and isinstance(files, dict)
                          and len(files) == 2780
                      ):
                          scenario = compressed
                      if names is None and isinstance(titles, dict) and len(titles) == 1608:
                          names = compressed

          print('\n'.join(diagnostics))
          if scenario is None:
              raise SystemExit('No valid 2780-file TW Scenario payload found')
          if names is None:
              raise SystemExit('No valid 1608-title TW naming payload found')

          for filename, compressed in (
              ('Selected-Scenarios.xz.b64.part001', scenario),
              ('Selected-Names.xz.b64.part001', names),
          ):
              (target / filename).write_text(
                  base64.b64encode(compressed).decode('ascii') + '\n',
                  encoding='ascii',
              )
              print(f'TW_PAYLOAD_SELECTED file={filename} bytes={len(compressed)}')
          PY

          python tools/extract_tw_compact_sources.py \
            --source-dir .tw-official-source/normalized \
            --scenario-output .tw-official-source/scenarios \
            --manifest-output .tw-official-source/manifests
          test -f .tw-official-source/manifests/getFieldStageMstList.json
          test -f .tw-official-source/manifests/getAdvMstList.json
          test -f .tw-official-source/manifests/getCollectionConditionMstList.json
          test "$(find .tw-official-source/scenarios -name '*.json' | wc -l)" -eq 2780

          python tools/materialize_tw_official_cn.py \
            --scenario-root .tw-official-source/scenarios \
            --manifest-root .tw-official-source/manifests

          npm --prefix website ci
          python -m unittest discover -s tests -p 'test_*.py'
          npm --prefix website run check
          npm --prefix website run build:worker
          npm --prefix website run verify:cloudflare-output
          python tools/build_split_search_indexes.py --validate-only

          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(
              Path('artifacts/exedra_official_tw_import_report.json').read_text(
                  encoding='utf-8'
              )
          )
          stats = report.get('stats', {})
          required = {
              'official_tw_groups': lambda value: value > 0,
              'failed_groups': lambda value: value == 0,
              'tw_source_files': lambda value: value == 2780,
              'tw_source_files_used': lambda value: value == 2780,
              'tw_source_files_unused': lambda value: value == 0,
          }
          for key, predicate in required.items():
              value = stats.get(key)
              if not isinstance(value, int) or not predicate(value):
                  raise SystemExit(f'Invalid TW import statistic {key}={value}: {stats}')
          stories = json.loads(
              Path('website/public/story_index.json').read_text(encoding='utf-8')
          )
          official = [
              item for item in stories
              if isinstance(item, dict) and item.get('official_tw') is True
          ]
          if len(official) != stats['official_tw_groups']:
              raise SystemExit(
                  f'Official story metadata mismatch: {len(official)} != '
                  f"{stats['official_tw_groups']}"
              )
          if not any(item.get('official_tw_chapter_title') for item in official):
              raise SystemExit('getFieldStageMstList chapter names were not applied')
          if not any(item.get('official_tw_section_titles') for item in official):
              raise SystemExit('getAdvMstList subsection names were not applied')
          print(
              'TW_OFFICIAL_CERTIFIED '
              f"groups={stats['official_tw_groups']} "
              f"json={stats.get('official_tw_json_files', 0)} "
              f"events={stats.get('official_tw_text_events', 0)} "
              f"sources={stats.get('tw_source_files_used', 0)}/2780"
          )
          PY
          BUILD
          code="${PIPESTATUS[0]}"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit materialized result or diagnostic status
        shell: bash
        env:
          MATERIALIZE_EXIT_CODE: ${{ steps.materialize.outputs.exit_code }}
        run: |
          set -euo pipefail
          rm -rf .tw-official-source
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          log_path = Path(os.environ['RUNNER_TEMP']) / 'tw-materialization.log'
          log = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else ''
          status = {
              'version': 1,
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'sourceCommit': os.environ['GITHUB_SHA'],
              'exitCode': int(os.environ.get('MATERIALIZE_EXIT_CODE') or 999),
              'success': os.environ.get('MATERIALIZE_EXIT_CODE') == '0',
              'logTail': log.splitlines()[-300:],
          }
          path = Path('artifacts/tw-materialization-status.json')
          path.parent.mkdir(exist_ok=True)
          path.write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          if [ "$MATERIALIZE_EXIT_CODE" = 0 ]; then
            git add -A
            message='[tw-materialized] Official TW zh-CN data, UI and split search'
          else
            git add -f artifacts/tw-materialization-status.json
            message="[tw-status] Materialization failed with code $MATERIALIZE_EXIT_CODE"
          fi
          if git diff --cached --quiet; then
            echo 'No materialization or diagnostic changes were produced.' >&2
            exit 1
          fi
          git commit -m "$message"
          git push origin HEAD:EXEDRA-TEST
          if [ "$MATERIALIZE_EXIT_CODE" != 0 ]; then
            exit "$MATERIALIZE_EXIT_CODE"
