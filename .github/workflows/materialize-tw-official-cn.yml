name: Materialize TW Official Simplified Chinese into EXEDRA-TEST

on:
  push:
    branches: [EXEDRA-TEST]
  workflow_dispatch:
    inputs:
      source_url:
        description: Immutable TW SP Release ZIP URL
        required: false
        type: string
        default: https://github.com/HiiragiNemu/MagiaExedraTWData/releases/download/tw-wiki-source-v1-20260806/exedra-tw-wiki-source-v1.zip
      source_sha256:
        description: Required SHA-256 for the complete Release ZIP
        required: false
        type: string
        default: 503c4c9a518d0a992abe800fccde4a97b35b2e4ddaeb2359e63eaa8d572cd1ac

permissions:
  contents: write

concurrency:
  group: materialize-tw-official-cn-exedra-test
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!startsWith(github.event.head_commit.message, '[tw-materialized]') &&
       !startsWith(github.event.head_commit.message, '[tw-status]'))
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: EXEDRA-TEST

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install pinned TW data-tool dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-compile -r requirements-data-tools.txt
          python - <<'PY'
          from tools.tw_official_import_core import simplified_converter
          convert = simplified_converter()
          probe = '繁體中文與臺灣檔案'
          result = convert(probe)
          if result == probe or any(char in result for char in ('體', '臺', '檔')):
              raise SystemExit(f'OpenCC tw2sp self-check failed: {probe!r} -> {result!r}')
          print(f'OPENCC_TW2SP_READY {probe!r} -> {result!r}')
          PY

      - name: Materialize, certify, publish search and build
        id: materialize
        continue-on-error: true
        shell: bash
        env:
          TW_SOURCE_URL: ${{ inputs.source_url || 'https://github.com/HiiragiNemu/MagiaExedraTWData/releases/download/tw-wiki-source-v1-20260806/exedra-tw-wiki-source-v1.zip' }}
          TW_SOURCE_SHA256: ${{ inputs.source_sha256 || '503c4c9a518d0a992abe800fccde4a97b35b2e4ddaeb2359e63eaa8d572cd1ac' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          SEARCH_R2_BUCKET: magi-assets
          SEARCH_R2_PUBLIC_BASE: https://pub-23cae552ecf24722bf572b29fa8dd03f.r2.dev
          SEARCH_RELEASE_TAG: magireader-search-assets-v1
          SEARCH_RELEASE_BASE: https://github.com/HiiragiNemu/magi-reader/releases/download/magireader-search-assets-v1
        run: |
          set +e
          set -o pipefail
          bash -euo pipefail <<'BUILD' 2>&1 | tee "$RUNNER_TEMP/tw-materialization.log"
          rm -rf "$RUNNER_TEMP/tw-sp-bundle"

          python tools/fetch_tw_sp_source_bundle.py \
            --source-url "$TW_SOURCE_URL" \
            --source-sha256 "$TW_SOURCE_SHA256" \
            --output-root "$RUNNER_TEMP/tw-sp-bundle"

          python tools/materialize_tw_official_cn.py \
            --source-bundle-root "$RUNNER_TEMP/tw-sp-bundle" \
            --source-provider exedra-wiki-sp \
            --expected-source-count 2780

          npm --prefix website ci
          python -m unittest discover -s tests -p 'test_*.py'
          npm --prefix website run check
          npm --prefix website run build:worker
          npm --prefix website run verify:cloudflare-output
          python tools/build_split_search_indexes.py --validate-only

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('artifacts/exedra_official_tw_import_report.json').read_text(
                  encoding='utf-8'
              )
          )
          stats = report.get('stats', {})
          expected_exact = {
              'official_tw_groups': 395,
              'official_tw_json_files': 2708,
              'official_tw_text_events': 93697,
              'official_tw_no_text_groups': 4,
              'official_tw_no_text_files': 7,
              'missing_tw_groups': 44,
              'tw_source_files': 2780,
              'tw_source_files_used': 2708,
              'tw_source_files_unused': 72,
              'tw_source_files_deferred_partial': 37,
              'tw_source_files_tw_only_without_jp': 28,
              'tw_source_files_no_text': 7,
              'tw_source_files_unexpected_unused': 0,
              'retained_non_tw_groups': 48,
          }
          for key, expected in expected_exact.items():
              value = stats.get(key)
              if value != expected:
                  raise SystemExit(
                      f'Invalid certified TW import statistic {key}={value!r}; '
                      f'expected {expected}: {stats}'
                  )
          if int(stats.get('failed_groups', 0) or 0) != 0:
              raise SystemExit(f'TW structural failures remain: {stats}')

          if (
              stats['tw_source_files_used']
              + stats['tw_source_files_deferred_partial']
              + stats['tw_source_files_tw_only_without_jp']
              + stats['tw_source_files_no_text']
              != stats['tw_source_files']
          ):
              raise SystemExit(f'TW source partition does not cover all files: {stats}')
          if (
              stats['tw_source_files_deferred_partial']
              + stats['tw_source_files_tw_only_without_jp']
              + stats['tw_source_files_no_text']
              != stats['tw_source_files_unused']
          ):
              raise SystemExit(f'TW unused source partition is inconsistent: {stats}')

          failures = report.get('failures')
          if not isinstance(failures, list):
              raise SystemExit('TW import report failures is not a list')
          structural = [
              item for item in failures
              if not isinstance(item, dict) or item.get('kind') != 'missing_source'
          ]
          if structural:
              raise SystemExit(f'Unexpected TW structural failures: {structural[:5]}')
          if len(failures) != stats['missing_tw_groups']:
              raise SystemExit(
                  f"TW missing-source report mismatch: {len(failures)} != "
                  f"{stats['missing_tw_groups']}"
              )

          stories = json.loads(
              Path('website/public/story_index.json').read_text(encoding='utf-8')
          )
          official = [
              item for item in stories
              if isinstance(item, dict) and item.get('official_tw') is True
          ]
          if len(official) != stats['official_tw_groups']:
              raise SystemExit(
                  f'Official story metadata mismatch: {len(official)} != '
                  f"{stats['official_tw_groups']}"
              )
          if not any(item.get('official_tw_chapter_title') for item in official):
              raise SystemExit('getFieldStageMstList chapter names were not applied')
          if not any(item.get('official_tw_section_titles') for item in official):
              raise SystemExit('getAdvMstList subsection names were not applied')
          print(
              'TW_OFFICIAL_CERTIFIED '
              f"groups={stats['official_tw_groups']} "
              f"json={stats['official_tw_json_files']} "
              f"events={stats['official_tw_text_events']} "
              f"classified={stats['tw_source_files']}/2780"
          )
          PY

          verify_search_url() {
            local label="$1"
            local url="$2"
            local expected_sha="$3"
            local expected_bytes="$4"
            local require_cors="$5"
            local output="$RUNNER_TEMP/search-${label}.json"
            local headers="$RUNNER_TEMP/search-${label}.headers"
            rm -f "$output" "$headers"
            if ! curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 15 --max-time 300 \
              --dump-header "$headers" \
              --header 'Origin: https://magireader-exedra-cn-test.crynetsystemscell.workers.dev' \
              -o "$output" "$url"; then
              return 1
            fi
            local actual_bytes actual_sha
            actual_bytes="$(wc -c < "$output" | tr -d ' ')"
            actual_sha="$(sha256sum "$output" | awk '{print $1}')"
            if [ "$actual_bytes" != "$expected_bytes" ] || [ "$actual_sha" != "$expected_sha" ]; then
              return 1
            fi
            if [ "$require_cors" = true ] && ! grep -Eiq '^access-control-allow-origin:[[:space:]]*(\\*|https://magireader-exedra-cn-test\\.crynetsystemscell\\.workers\\.dev)[[:space:]]*$' "$headers"; then
              return 1
            fi
            return 0
          }

          ensure_search_release() {
            if gh release view "$SEARCH_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              return 0
            fi
            gh release create "$SEARCH_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'MagiReader content-addressed search assets v1' \
              --notes 'Immutable full-text search payload storage. Runtime objects are selected and verified by SHA-256 manifests.' \
              --prerelease
          }

          for scope in magireco exedra; do
            read -r object_key expected_sha expected_bytes <<< "$(
              python3 - "$scope" <<'PY'
          import json, sys
          from pathlib import Path
          scope = sys.argv[1]
          manifest = json.loads(
              Path(f'website/public/search_index_manifest.{scope}.json')
              .read_text(encoding='utf-8')
          )
          print(manifest['object_key'], manifest['sha256'], manifest['bytes'])
          PY
            )"
            local_file="artifacts/search-split/search_content.$scope.json"
            local_bytes="$(wc -c < "$local_file" | tr -d ' ')"
            local_sha="$(sha256sum "$local_file" | awk '{print $1}')"
            if [ "$local_bytes" != "$expected_bytes" ] || [ "$local_sha" != "$expected_sha" ]; then
              echo "::error::Local split search payload mismatch for $scope"
              exit 1
            fi

            r2_url="${SEARCH_R2_PUBLIC_BASE}/${object_key}?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${scope}"
            if verify_search_url "r2-$scope" "$r2_url" "$expected_sha" "$expected_bytes" false; then
              echo "SEARCH_R2_ALREADY_VALID scope=$scope bytes=$expected_bytes sha256=$expected_sha object=$object_key"
              continue
            fi

            r2_uploaded=false
            if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
              echo "Attempting certified $scope search upload to R2 bucket $SEARCH_R2_BUCKET"
              if (
                cd website &&
                npx wrangler r2 object put \
                  "$SEARCH_R2_BUCKET/$object_key" \
                  --file "../$local_file" \
                  --content-type 'application/json; charset=utf-8' \
                  --cache-control 'public, max-age=31536000, immutable' \
                  --remote
              ); then
                for attempt in $(seq 1 8); do
                  if verify_search_url "r2-$scope" "$r2_url" "$expected_sha" "$expected_bytes" false; then
                    r2_uploaded=true
                    break
                  fi
                  sleep 5
                done
              else
                echo "::warning::R2 upload unavailable for $scope; falling back to GitHub Release storage."
              fi
            fi
            if [ "$r2_uploaded" = true ]; then
              echo "SEARCH_R2_PUBLISH_OK scope=$scope bytes=$expected_bytes sha256=$expected_sha object=$object_key"
              continue
            fi

            release_asset="search-${scope}-${expected_sha}.json"
            release_url="${SEARCH_RELEASE_BASE}/${release_asset}"
            if verify_search_url "release-$scope" "$release_url" "$expected_sha" "$expected_bytes" true; then
              echo "SEARCH_RELEASE_ALREADY_VALID scope=$scope bytes=$expected_bytes sha256=$expected_sha asset=$release_asset"
              continue
            fi

            ensure_search_release
            upload_path="$RUNNER_TEMP/$release_asset"
            cp "$local_file" "$upload_path"
            gh release upload "$SEARCH_RELEASE_TAG" "$upload_path" \
              --repo "$GITHUB_REPOSITORY" --clobber

            release_ready=false
            for attempt in $(seq 1 8); do
              if verify_search_url "release-$scope" "$release_url" "$expected_sha" "$expected_bytes" true; then
                release_ready=true
                break
              fi
              sleep 5
            done
            if [ "$release_ready" != true ]; then
              echo "::error::GitHub Release search asset failed full SHA-256/CORS verification: $scope"
              exit 1
            fi
            echo "SEARCH_RELEASE_PUBLISH_OK scope=$scope bytes=$expected_bytes sha256=$expected_sha asset=$release_asset"
          done

          # Patch the isolated test deployment so it refuses to deploy unless
          # either the canonical R2 object or the verified Release fallback is public.
          python tools/patch_tw_deploy_workflow.py
          BUILD
          code="${PIPESTATUS[0]}"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit materialized result or diagnostic status
        shell: bash
        env:
          MATERIALIZE_EXIT_CODE: ${{ steps.materialize.outputs.exit_code }}
        run: |
          set -euo pipefail
          rm -rf .tw-official-source
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          log_path = Path(os.environ['RUNNER_TEMP']) / 'tw-materialization.log'
          log = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else ''
          status = {
              'version': 1,
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'sourceCommit': os.environ['GITHUB_SHA'],
              'exitCode': int(os.environ.get('MATERIALIZE_EXIT_CODE') or 999),
              'success': os.environ.get('MATERIALIZE_EXIT_CODE') == '0',
              'logTail': log.splitlines()[-300:],
          }
          path = Path('artifacts/tw-materialization-status.json')
          path.parent.mkdir(exist_ok=True)
          path.write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          if [ "$MATERIALIZE_EXIT_CODE" = 0 ]; then
            git add -A
            message='[tw-materialized] Certified official TW zh-CN data and public search release'
          else
            git add -f artifacts/tw-materialization-status.json
            message="[tw-status] Materialization failed with code $MATERIALIZE_EXIT_CODE"
          fi
          if git diff --cached --quiet; then
            echo 'No materialization or diagnostic changes were produced.' >&2
            exit 1
          fi
          git commit -m "$message"
          git push origin HEAD:EXEDRA-TEST
          if [ "$MATERIALIZE_EXIT_CODE" != 0 ]; then
            exit "$MATERIALIZE_EXIT_CODE"
          fi
