name: Materialize TW Official Simplified Chinese

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-tw-official-cn
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SOURCE_TAG: tw-source-zh-cn-2026-08-04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/tw-official-cn-complete

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Download and authenticate supplied source archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tw-official-source/downloads
          gh release download "$SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir .tw-official-source/downloads \
            --pattern 'Scenarios_zh-CN.7z' \
            --pattern 'Manifests_zh-CN.7z'
          printf '%s  %s\n' \
            '64c86700651b845b484f6100fed61a8c2b860028cda8130456a57979ee907452' \
            '.tw-official-source/downloads/Scenarios_zh-CN.7z' \
            '9125ae75d02ac69572fafc08fe2c1479ff872f6394d03b77f5bd046471ebda74' \
            '.tw-official-source/downloads/Manifests_zh-CN.7z' \
            | sha256sum --check --strict

      - name: Extract supplied archives
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          mkdir -p .tw-official-source/scenarios .tw-official-source/manifests
          7z x -y .tw-official-source/downloads/Scenarios_zh-CN.7z \
            -o.tw-official-source/scenarios >/dev/null
          7z x -y .tw-official-source/downloads/Manifests_zh-CN.7z \
            -o.tw-official-source/manifests >/dev/null
          test -f .tw-official-source/manifests/getFieldStageMstList.json
          test -f .tw-official-source/manifests/getAdvMstList.json
          test -f .tw-official-source/manifests/getCollectionConditionMstList.json
          test -n "$(find .tw-official-source/scenarios -name '*.json' -print -quit)"

      - name: Inject official TW text and materialize feature branch
        run: >-
          python tools/materialize_tw_official_cn.py
          --scenario-root .tw-official-source/scenarios
          --manifest-root .tw-official-source/manifests

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Run complete repository validation
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          cd website
          npm run check
          npm run build:worker

      - name: Verify split search objects
        run: python tools/build_split_search_indexes.py --validate-only

      - name: Commit certified materialized result
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tw-official-source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No materialized changes were produced.' >&2
            exit 1
          fi
          git commit -m '[tw-materialized] Inject official TW zh-CN corpus and reader features'
          git push origin HEAD:feature/tw-official-cn-complete
