name: Materialize TW Official Simplified Chinese into EXEDRA-TEST

on:
  push:
    branches: [EXEDRA-TEST]
  workflow_dispatch:
    inputs:
      source_url:
        description: Immutable TW SP Release ZIP URL
        required: false
        type: string
        default: https://github.com/HiiragiNemu/MagiaExedraTWData/releases/download/tw-wiki-source-v1-20260806/exedra-tw-wiki-source-v1.zip
      source_sha256:
        description: Required SHA-256 for the complete Release ZIP
        required: false
        type: string
        default: 503c4c9a518d0a992abe800fccde4a97b35b2e4ddaeb2359e63eaa8d572cd1ac

permissions:
  contents: write

concurrency:
  group: materialize-tw-official-cn-exedra-test
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!startsWith(github.event.head_commit.message, '[tw-materialized]') &&
       !startsWith(github.event.head_commit.message, '[tw-status]'))
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: EXEDRA-TEST

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Materialize, validate and build
        id: materialize
        continue-on-error: true
        shell: bash
        env:
          TW_SOURCE_URL: ${{ inputs.source_url || 'https://github.com/HiiragiNemu/MagiaExedraTWData/releases/download/tw-wiki-source-v1-20260806/exedra-tw-wiki-source-v1.zip' }}
          TW_SOURCE_SHA256: ${{ inputs.source_sha256 || '503c4c9a518d0a992abe800fccde4a97b35b2e4ddaeb2359e63eaa8d572cd1ac' }}
        run: |
          set +e
          set -o pipefail
          bash -euo pipefail <<'BUILD' 2>&1 | tee "$RUNNER_TEMP/tw-materialization.log"
          rm -rf "$RUNNER_TEMP/tw-sp-bundle"

          python tools/fetch_tw_sp_source_bundle.py \
            --source-url "$TW_SOURCE_URL" \
            --source-sha256 "$TW_SOURCE_SHA256" \
            --output-root "$RUNNER_TEMP/tw-sp-bundle"

          python tools/materialize_tw_official_cn.py \
            --source-bundle-root "$RUNNER_TEMP/tw-sp-bundle" \
            --source-provider exedra-wiki-sp \
            --expected-source-count 2780

          npm --prefix website ci
          python -m unittest discover -s tests -p 'test_*.py'
          npm --prefix website run check
          npm --prefix website run build:worker
          npm --prefix website run verify:cloudflare-output
          python tools/build_split_search_indexes.py --validate-only

          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(
              Path('artifacts/exedra_official_tw_import_report.json').read_text(
                  encoding='utf-8'
              )
          )
          stats = report.get('stats', {})
          required = {
              'official_tw_groups': lambda value: value > 0,
              'failed_groups': lambda value: value == 0,
              'tw_source_files': lambda value: value == 2780,
              'tw_source_files_used': lambda value: value == 2780,
              'tw_source_files_unused': lambda value: value == 0,
          }
          for key, predicate in required.items():
              value = stats.get(key)
              if not isinstance(value, int) or not predicate(value):
                  raise SystemExit(f'Invalid TW import statistic {key}={value}: {stats}')
          stories = json.loads(
              Path('website/public/story_index.json').read_text(encoding='utf-8')
          )
          official = [
              item for item in stories
              if isinstance(item, dict) and item.get('official_tw') is True
          ]
          if len(official) != stats['official_tw_groups']:
              raise SystemExit(
                  f'Official story metadata mismatch: {len(official)} != '
                  f"{stats['official_tw_groups']}"
              )
          if not any(item.get('official_tw_chapter_title') for item in official):
              raise SystemExit('getFieldStageMstList chapter names were not applied')
          if not any(item.get('official_tw_section_titles') for item in official):
              raise SystemExit('getAdvMstList subsection names were not applied')
          print(
              'TW_OFFICIAL_CERTIFIED '
              f"groups={stats['official_tw_groups']} "
              f"json={stats.get('official_tw_json_files', 0)} "
              f"events={stats.get('official_tw_text_events', 0)} "
              f"sources={stats.get('tw_source_files_used', 0)}/2780"
          )
          PY
          BUILD
          code="${PIPESTATUS[0]}"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit materialized result or diagnostic status
        shell: bash
        env:
          MATERIALIZE_EXIT_CODE: ${{ steps.materialize.outputs.exit_code }}
        run: |
          set -euo pipefail
          rm -rf .tw-official-source
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          log_path = Path(os.environ['RUNNER_TEMP']) / 'tw-materialization.log'
          log = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else ''
          status = {
              'version': 1,
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'sourceCommit': os.environ['GITHUB_SHA'],
              'exitCode': int(os.environ.get('MATERIALIZE_EXIT_CODE') or 999),
              'success': os.environ.get('MATERIALIZE_EXIT_CODE') == '0',
              'logTail': log.splitlines()[-300:],
          }
          path = Path('artifacts/tw-materialization-status.json')
          path.parent.mkdir(exist_ok=True)
          path.write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          if [ "$MATERIALIZE_EXIT_CODE" = 0 ]; then
            git add -A
            message='[tw-materialized] Official TW zh-CN data, UI and split search'
          else
            git add -f artifacts/tw-materialization-status.json
            message="[tw-status] Materialization failed with code $MATERIALIZE_EXIT_CODE"
          fi
          if git diff --cached --quiet; then
            echo 'No materialization or diagnostic changes were produced.' >&2
            exit 1
          fi
          git commit -m "$message"
          git push origin HEAD:EXEDRA-TEST
          if [ "$MATERIALIZE_EXIT_CODE" != 0 ]; then
            exit "$MATERIALIZE_EXIT_CODE"
          fi
