name: Materialize TW Official Simplified Chinese into EXEDRA-TEST

on:
  push:
    branches: [EXEDRA-TEST]
  workflow_dispatch:
    inputs:
      source_url:
        description: Immutable TW SP Release ZIP URL
        required: false
        type: string
        default: https://github.com/HiiragiNemu/MagiaExedraTWData/releases/download/tw-wiki-source-v1-20260806/exedra-tw-wiki-source-v1.zip
      source_sha256:
        description: Required SHA-256 for the complete Release ZIP
        required: false
        type: string
        default: 503c4c9a518d0a992abe800fccde4a97b35b2e4ddaeb2359e63eaa8d572cd1ac

permissions:
  contents: write

concurrency:
  group: materialize-tw-official-cn-exedra-test
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!startsWith(github.event.head_commit.message, '[tw-materialized]') &&
       !startsWith(github.event.head_commit.message, '[tw-status]'))
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: EXEDRA-TEST

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install pinned TW data-tool dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-compile -r requirements-data-tools.txt
          python - <<'PY'
          from tools.tw_official_import_core import simplified_converter
          convert = simplified_converter()
          probe = '繁體中文與臺灣檔案'
          result = convert(probe)
          if result == probe or any(char in result for char in ('體', '臺', '檔')):
              raise SystemExit(f'OpenCC tw2sp self-check failed: {probe!r} -> {result!r}')
          print(f'OPENCC_TW2SP_READY {probe!r} -> {result!r}')
          PY

      - name: Materialize, certify, chunk and build
        id: materialize
        continue-on-error: true
        shell: bash
        env:
          TW_SOURCE_URL: ${{ inputs.source_url || 'https://github.com/HiiragiNemu/MagiaExedraTWData/releases/download/tw-wiki-source-v1-20260806/exedra-tw-wiki-source-v1.zip' }}
          TW_SOURCE_SHA256: ${{ inputs.source_sha256 || '503c4c9a518d0a992abe800fccde4a97b35b2e4ddaeb2359e63eaa8d572cd1ac' }}
        run: |
          set +e
          set -o pipefail
          bash -euo pipefail <<'BUILD' 2>&1 | tee "$RUNNER_TEMP/tw-materialization.log"
          rm -rf "$RUNNER_TEMP/tw-sp-bundle"

          python tools/fetch_tw_sp_source_bundle.py \
            --source-url "$TW_SOURCE_URL" \
            --source-sha256 "$TW_SOURCE_SHA256" \
            --output-root "$RUNNER_TEMP/tw-sp-bundle"

          python tools/materialize_tw_official_cn.py \
            --source-bundle-root "$RUNNER_TEMP/tw-sp-bundle" \
            --source-provider exedra-wiki-sp \
            --expected-source-count 2780

          # Apply the permanent runtime/build patches before the regression suite.
          python tools/patch_search_chunk_runtime.py
          python tools/patch_tw_deploy_workflow.py

          npm --prefix website ci
          python -m unittest discover -s tests -p 'test_*.py'
          npm --prefix website run check
          python tools/build_split_search_indexes.py --validate-only

          # The large payload stays ignored by Git.  The existing manifest v2
          # hashes are materialized into 1 MiB same-origin files only for the
          # Cloudflare build and verified both before and after OpenNext copies them.
          python tools/search_chunk_delivery.py materialize
          python tools/search_chunk_delivery.py verify-tree --root website/public
          npm --prefix website run build:worker
          npm --prefix website run verify:cloudflare-output
          python tools/search_chunk_delivery.py verify-tree --root website/.open-next/assets

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('artifacts/exedra_official_tw_import_report.json').read_text(
                  encoding='utf-8'
              )
          )
          stats = report.get('stats', {})
          expected_exact = {
              'official_tw_groups': 395,
              'official_tw_json_files': 2708,
              'official_tw_text_events': 93697,
              'official_tw_no_text_groups': 4,
              'official_tw_no_text_files': 7,
              'missing_tw_groups': 44,
              'tw_source_files': 2780,
              'tw_source_files_used': 2708,
              'tw_source_files_unused': 72,
              'tw_source_files_deferred_partial': 37,
              'tw_source_files_tw_only_without_jp': 28,
              'tw_source_files_no_text': 7,
              'tw_source_files_unexpected_unused': 0,
              'retained_non_tw_groups': 48,
          }
          for key, expected in expected_exact.items():
              value = stats.get(key)
              if value != expected:
                  raise SystemExit(
                      f'Invalid certified TW import statistic {key}={value!r}; '
                      f'expected {expected}: {stats}'
                  )
          if int(stats.get('failed_groups', 0) or 0) != 0:
              raise SystemExit(f'TW structural failures remain: {stats}')
          if (
              stats['tw_source_files_used']
              + stats['tw_source_files_deferred_partial']
              + stats['tw_source_files_tw_only_without_jp']
              + stats['tw_source_files_no_text']
              != stats['tw_source_files']
          ):
              raise SystemExit(f'TW source partition does not cover all files: {stats}')
          if (
              stats['tw_source_files_deferred_partial']
              + stats['tw_source_files_tw_only_without_jp']
              + stats['tw_source_files_no_text']
              != stats['tw_source_files_unused']
          ):
              raise SystemExit(f'TW unused source partition is inconsistent: {stats}')

          failures = report.get('failures')
          if not isinstance(failures, list):
              raise SystemExit('TW import report failures is not a list')
          structural = [
              item for item in failures
              if not isinstance(item, dict) or item.get('kind') != 'missing_source'
          ]
          if structural:
              raise SystemExit(f'Unexpected TW structural failures: {structural[:5]}')
          if len(failures) != stats['missing_tw_groups']:
              raise SystemExit(
                  f"TW missing-source report mismatch: {len(failures)} != "
                  f"{stats['missing_tw_groups']}"
              )

          stories = json.loads(
              Path('website/public/story_index.json').read_text(encoding='utf-8')
          )
          official = [
              item for item in stories
              if isinstance(item, dict) and item.get('official_tw') is True
          ]
          if len(official) != stats['official_tw_groups']:
              raise SystemExit(
                  f'Official story metadata mismatch: {len(official)} != '
                  f"{stats['official_tw_groups']}"
              )
          if not any(item.get('official_tw_chapter_title') for item in official):
              raise SystemExit('getFieldStageMstList chapter names were not applied')
          if not any(item.get('official_tw_section_titles') for item in official):
              raise SystemExit('getAdvMstList subsection names were not applied')
          print(
              'TW_OFFICIAL_CERTIFIED '
              f"groups={stats['official_tw_groups']} "
              f"json={stats['official_tw_json_files']} "
              f"events={stats['official_tw_text_events']} "
              f"classified={stats['tw_source_files']}/2780"
          )
          PY
          BUILD
          code="${PIPESTATUS[0]}"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit materialized result or diagnostic status
        shell: bash
        env:
          MATERIALIZE_EXIT_CODE: ${{ steps.materialize.outputs.exit_code }}
        run: |
          set -euo pipefail
          rm -rf .tw-official-source
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          log_path = Path(os.environ['RUNNER_TEMP']) / 'tw-materialization.log'
          log = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else ''
          status = {
              'version': 1,
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'sourceCommit': os.environ['GITHUB_SHA'],
              'exitCode': int(os.environ.get('MATERIALIZE_EXIT_CODE') or 999),
              'success': os.environ.get('MATERIALIZE_EXIT_CODE') == '0',
              'logTail': log.splitlines()[-300:],
          }
          path = Path('artifacts/tw-materialization-status.json')
          path.parent.mkdir(exist_ok=True)
          path.write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          if [ "$MATERIALIZE_EXIT_CODE" = 0 ]; then
            git add -A
            message='[tw-materialized] Certified TW zh-CN data and same-origin split search'
          else
            git add -f artifacts/tw-materialization-status.json
            message="[tw-status] Materialization failed with code $MATERIALIZE_EXIT_CODE"
          fi
          if git diff --cached --quiet; then
            echo 'No materialization or diagnostic changes were produced.' >&2
            exit 1
          fi
          git commit -m "$message"
          git push origin HEAD:EXEDRA-TEST
          if [ "$MATERIALIZE_EXIT_CODE" != 0 ]; then
            exit "$MATERIALIZE_EXIT_CODE"
          fi
