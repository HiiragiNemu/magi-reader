name: Deploy Public Magia Story Reader

on:
  pull_request:
    branches: [feature/portal-story-reader-v7]
    paths:
      - 'website/**'
      - 'generate_story_index.py'
      - 'build_search_index_v6.py'
      - 'prepare_public_story_reader.py'
      - 'prepare_public_story_support.py'
      - 'validate_public_story_corpus.py'
      - 'publish_raw_story_json.py'
      - 'magireco-source-master/**'
      - 'magireco-translate-data-master/**'
      - 'magiraexedra-source-master/**'
      - 'magiraexedra-translate-data-master/**'
      - '.github/workflows/deploy-public-story-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-public-magia-story-reader
  cancel-in-progress: true

jobs:
  build-deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_STORY_ARCHIVE: '1'
      STORY_WORKER_NAME: magireco-exedra-story-reader
      STORY_WORKER_HOSTNAME: magireco-exedra-story-reader.crynetsystemscell.workers.dev
      STORY_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Check out complete story corpus
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Prepare public archive source
        run: |
          python prepare_public_story_reader.py --website website
          grep -q 'PUBLIC_STORY_ARCHIVE' website/app/page.tsx
          grep -q '魔法纪录与 Magia Exedra 剧情阅读器' website/app/layout.tsx
          grep -q 'href="/raw-json"' website/app/page.tsx
          grep -q 'href="/raw-json"' 'website/app/reader/[id]/page.tsx'

      - name: Run scenario pipeline tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Generate complete catalogue and raw JSON archive
        run: |
          python generate_story_index.py
          python publish_raw_story_json.py \
            --repo . \
            --public website/public \
            --repository "${{ github.repository }}" \
            --commit "$STORY_SOURCE_COMMIT" \
            | tee public-raw-json-report.json
          python prepare_public_story_support.py \
            --public website/public \
            --commit "$STORY_SOURCE_COMMIT"
          python validate_public_story_corpus.py \
            --public website/public \
            --report public-story-corpus-report.json
          test -s website/public/data/machine_translation_manifest.generated.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path('website/public/raw_story_json_manifest.json').read_text(encoding='utf-8'))
          counts = manifest.get('counts') or {}
          if manifest.get('entries', 0) <= 0:
              raise SystemExit(f'raw JSON archive is empty: {manifest}')
          if manifest.get('commit') != os.environ['STORY_SOURCE_COMMIT']:
              raise SystemExit(f'raw JSON manifest commit mismatch: {manifest.get("commit")}')
          for required in ('magireco_jp', 'magireco_cn', 'exedra_jp'):
              if counts.get(required, 0) <= 0:
                  raise SystemExit(f'raw JSON language tree missing: {required}: {counts}')
          files = manifest.get('files') or []
          if not files or not all(str(item.get('url', '')).startswith('https://raw.githubusercontent.com/') for item in files[:100]):
              raise SystemExit('raw JSON manifest contains invalid immutable URLs')
          if not Path('website/app/raw-json/page.tsx').is_file():
              raise SystemExit('raw JSON browser page is missing')
          support = json.loads(Path('website/public/data/machine_translation_manifest.generated.json').read_text(encoding='utf-8'))
          if support.get('total') != 0 or support.get('entries') != []:
              raise SystemExit(f'public machine review manifest is not empty: {support}')
          print('RAW_JSON_PUBLIC_ARCHIVE_OK', manifest['entries'], manifest['bytes'], counts)
          PY

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Run generated-site ESLint
        working-directory: website
        run: npm run lint

      - name: Run generated-site TypeScript compiler
        working-directory: website
        run: npm run type-check

      - name: Run generated-site unit tests
        id: generated_node_tests
        working-directory: website
        shell: bash
        run: |
          set +e
          node --test --test-reporter=spec > generated-node-test-report.txt 2>&1
          status=$?
          cat generated-node-test-report.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload generated-site test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-story-generated-node-test-report
          path: website/generated-node-test-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Require generated-site unit tests
        if: steps.generated_node_tests.outputs.status != '0'
        run: |
          echo 'Generated-site Node tests failed; inspect public-story-generated-node-test-report.' >&2
          exit 1

      - name: Generate matching full-text manifest
        run: |
          payload="$RUNNER_TEMP/search_content.json"
          python build_search_index_v6.py --output "$payload"
          python build_search_index_v6.py --output "$payload" --validate-only
          python - <<'PY'
          import json
          from pathlib import Path
          search = json.loads(Path('website/public/search_index_manifest.json').read_text(encoding='utf-8'))
          if not search.get('entries') or not search.get('bytes') or not search.get('story_index_sha256'):
              raise SystemExit(f'invalid search manifest: {search}')
          print('SEARCH_MANIFEST_OK', search.get('entries'), search.get('bytes'))
          PY

      - name: Build OpenNext Worker
        working-directory: website
        run: npm run build:worker

      - name: Prepare isolated public Worker configuration
        working-directory: website
        shell: bash
        run: |
          set -euo pipefail
          cat > .wrangler-story-bootstrap.jsonc <<EOF
          {
            "name": "$STORY_WORKER_NAME",
            "main": ".wrangler-story-bootstrap.mjs",
            "compatibility_date": "2026-02-14",
            "workers_dev": true
          }
          EOF
          cat > .wrangler-story-bootstrap.mjs <<'EOF'
          export default { fetch() { return new Response('Preparing story reader deployment.'); } };
          EOF
          cat > .wrangler-story-public.jsonc <<EOF
          {
            "\$schema": "node_modules/wrangler/config-schema.json",
            "name": "$STORY_WORKER_NAME",
            "main": ".open-next/worker.js",
            "compatibility_date": "2026-02-14",
            "compatibility_flags": ["nodejs_compat", "global_fetch_strictly_public"],
            "workers_dev": true,
            "assets": { "directory": ".open-next/assets", "binding": "ASSETS" },
            "services": [
              { "binding": "WORKER_SELF_REFERENCE", "service": "$STORY_WORKER_NAME" }
            ],
            "vars": {
              "PROOFREADING_TARGET_BRANCH": "feature/portal-story-reader-v7",
              "PROOFREADING_SOURCE_COMMIT": "$STORY_SOURCE_COMMIT",
              "PROOFREADING_GITHUB_REPO": "${{ github.repository }}",
              "PROOFREADING_ALLOW_GITHUB_ADMIN": "false",
              "PROOFREADING_TURNSTILE_TEST_MODE": "false"
            }
          }
          EOF

      - name: Create Worker service shell
        working-directory: website
        run: npx wrangler deploy --config .wrangler-story-bootstrap.jsonc

      - name: Deploy complete public story reader
        working-directory: website
        run: npx opennextjs-cloudflare deploy --config .wrangler-story-public.jsonc

      - name: Wait for both public story systems and raw JSON
        env:
          SITE_URL: https://${{ env.STORY_WORKER_HOSTNAME }}
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 80); do
            home_code=$(curl -L --silent --show-error -o "$RUNNER_TEMP/story-home.html" -w '%{http_code}' "$SITE_URL/?probe=${GITHUB_RUN_ID}-$attempt")
            index_code=$(curl -L --silent --show-error -o "$RUNNER_TEMP/story-index.json" -w '%{http_code}' "$SITE_URL/story_index.json?probe=${GITHUB_RUN_ID}-$attempt")
            raw_code=$(curl -L --silent --show-error -o "$RUNNER_TEMP/raw-json-manifest.json" -w '%{http_code}' "$SITE_URL/raw_story_json_manifest.json?probe=${GITHUB_RUN_ID}-$attempt")
            if [ "$home_code" = 200 ] && [ "$index_code" = 200 ] && [ "$raw_code" = 200 ]; then
              if python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          stories = json.loads((root / 'story-index.json').read_text(encoding='utf-8'))
          raw = json.loads((root / 'raw-json-manifest.json').read_text(encoding='utf-8'))
          magireco = sum(not str(item.get('category', '')).startswith('exedra_') for item in stories)
          exedra = sum(str(item.get('category', '')).startswith('exedra_') for item in stories)
          ready = (
              bool(stories) and bool(magireco) and bool(exedra)
              and raw.get('entries', 0) > 0
              and raw.get('commit') == os.environ['STORY_SOURCE_COMMIT']
          )
          raise SystemExit(0 if ready else 1)
          PY
              then
                ready=true
                break
              fi
            fi
            sleep 5
          done
          [ "$ready" = true ] || { echo 'Public story reader did not expose both systems and raw JSON.' >&2; exit 1; }

      - name: Validate public sources and disabled management
        env:
          SITE_URL: https://${{ env.STORY_WORKER_HOSTNAME }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          base = os.environ['SITE_URL']
          root = Path(os.environ['RUNNER_TEMP'])
          stories = json.loads((root / 'story-index.json').read_text(encoding='utf-8'))
          raw = json.loads((root / 'raw-json-manifest.json').read_text(encoding='utf-8'))
          selected = []
          for is_exedra in (False, True):
              item = next(value for value in stories if bool(str(value.get('category', '')).startswith('exedra_')) is is_exedra and (value.get('path_cn') or value.get('path_jp')))
              selected.append(item)
          for item in selected:
              for path in (item.get('path_cn'), item.get('path_jp')):
                  if not path:
                      continue
                  with urllib.request.urlopen(base + path, timeout=60) as response:
                      payload = response.read()
                  if len(payload) < 10:
                      raise SystemExit(f'empty story source: {item.get("id")} {path}')
          raw_file = next(item for item in raw['files'] if item.get('game') == 'exedra' and item.get('language') == 'jp')
          with urllib.request.urlopen(raw_file['url'], timeout=60) as response:
              raw_payload = response.read()
          json.loads(raw_payload.decode('utf-8-sig'))
          with urllib.request.urlopen(base + '/api/proofreading/config', timeout=60) as response:
              config = json.load(response)
          if config.get('submissions_enabled') or config.get('github_admin_auth'):
              raise SystemExit(f'public archive unexpectedly enabled management: {config}')
          print('PUBLIC_STORY_SOURCES_OK', [item.get('id') for item in selected], raw_file['url'])
          PY

      - name: Install Chromium and run browser regression
        working-directory: website
        env:
          SITE_URL: https://${{ env.STORY_WORKER_HOSTNAME }}
        run: |
          npx playwright install --with-deps chromium
          node scripts/public-story-smoke.mjs

      - name: Upload public story reader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-magia-story-reader-evidence
          path: |
            public-story-corpus-report.json
            public-raw-json-report.json
            website/public-story-evidence
          if-no-files-found: warn
          retention-days: 14
