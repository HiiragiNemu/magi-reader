name: Export Exedra Wiki Character Stories

on:
  pull_request:
    branches:
      - tooling/exedra-wiki-export-base

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.event.pull_request.head.ref == 'tooling/exedra-wiki-export-run' &&
      github.event.pull_request.base.ref == 'tooling/exedra-wiki-export-base'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch character Chinese pages from MediaWiki API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wiki/pages"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          API = 'https://exedra.wiki/w/api.php'
          BASE = 'https://exedra.wiki'
          OUT = Path(os.environ['RUNNER_TEMP']) / 'wiki'
          PAGES = OUT / 'pages'
          PAGES.mkdir(parents=True, exist_ok=True)
          HEADERS = {'User-Agent': 'MagiReader-Exedra-Wiki-Character-Export/1.0'}
          SLUGS = {
              'character_arina': ['Alina_Gray'],
              'character_ashley': ['Ashley_Taylor'],
              'character_asuka': ['Asuka_Tatsuki'],
              'character_ayame': ['Ayame_Mikuri'],
              'character_corbeau': ['Corbeau'],
              'character_darc': ['Tart', 'Darc'],
              'character_felicia': ['Felicia_Mitsuki'],
              'character_fuka': ['Fuka_Higurashi'],
              'character_hanna': ['Hanna_Sarasa'],
              'character_hazuki': ['Hazuki_Yusa'],
              'character_himika': ['Himika_Mao'],
              'character_homura': ['Homura_Akemi'],
              'character_iroha': ['Iroha_Tamaki'],
              'character_kaede': ['Kaede_Akino'],
              'character_kako': ['Kako_Natsume'],
              'character_kanae': ['Kanae_Yukino'],
              'character_karin': ['Karin_Misono'],
              'character_kirika': ['Kirika_Kure'],
              'character_koito': ['Koito_Asako'],
              'character_kokoro': ['Kokoro_Awane'],
              'character_konoha': ['Konoha_Shizumi'],
              'character_kush': ['Kush_Irnam', 'Kush'],
              'character_kyoko': ['Kyoko_Sakura'],
              'character_liz': ['Liz_Hawkwood', 'Riz_Hawkwood'],
              'character_mabayu': ['Mabayu_Aki'],
              'character_madoka': ['Madoka_Kaname'],
              'character_mami': ['Mami_Tomoe'],
              'character_mannenzakura': ['Rumor_of_the_Ten-Thousand-Year_Sakura'],
              'character_masara': ['Masara_Kagami'],
              'character_mayoi': ['Mayoi_Hachikuji'],
              'character_meiyui': ['Meiyui_Chun'],
              'character_melissa': ['Melissa_de_Vignolles', 'Melissa'],
              'character_meru': ['Meru_Anna'],
              'character_mifuyu': ['Mifuyu_Azusa'],
              'character_mitama': ['Mitama_Yakumo'],
              'character_mito': ['Mito_Aino'],
              'character_momoko': ['Momoko_Togame'],
              'character_nagisa': ['Nagisa_Momoe'],
              'character_nanaka': ['Nanaka_Tokiwa'],
              'character_natsuki': ['Natsuki_Utsuho'],
              'character_nemu': ['Nemu_Hiiragi'],
              'character_oriko': ['Oriko_Mikuni'],
              'character_reira': ['Leila_Ibuki', 'Reira_Ibuki'],
              'character_ren': ['Ren_Isuzu'],
              'character_rena': ['Rena_Minami'],
              'character_rika': ['Rika_Ayano'],
              'character_riko': ['Riko_Chiaki'],
              'character_sana': ['Sana_Futaba'],
              'character_sayaka': ['Sayaka_Miki'],
              'character_seika': ['Seika_Kumi'],
              'character_senpai': ['Madoka-senpai', 'Madoka_Senpai'],
              'character_shinobu': ['Shinobu_Oshino'],
              'character_sumire': ['Sumire_Yomeiji'],
              'character_touka': ['Touka_Satomi'],
              'character_tsukasa': ['Tsukasa_Amane'],
              'character_tsukuyo': ['Tsukuyo_Amane'],
              'character_tsuruno': ['Tsuruno_Yui'],
              'character_ui': ['Ui_Tamaki'],
              'character_yachiyo': ['Yachiyo_Nanami'],
              'character_yotsugi': ['Yotsugi_Ononoki'],
              'character_yuma': ['Yuma_Chitose'],
          }

          def api(params):
              url = API + '?' + urllib.parse.urlencode(params)
              request = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(request, timeout=90) as response:
                  payload = response.read()
              return url, json.loads(payload.decode('utf-8'))

          records = []
          for group_key, slugs in SLUGS.items():
              attempts = []
              accepted = None
              for slug in slugs:
                  for title in (f':{slug}/Story/Chinese', f'{slug}/Story/Chinese'):
                      try:
                          url, parsed = api({
                              'action': 'parse', 'page': title,
                              'prop': 'wikitext|text|sections|displaytitle',
                              'redirects': '1', 'format': 'json',
                              'formatversion': '2',
                          })
                          parse = parsed.get('parse') if isinstance(parsed, dict) else None
                          wikitext = parse.get('wikitext') if isinstance(parse, dict) else None
                          html = parse.get('text') if isinstance(parse, dict) else None
                          attempts.append({
                              'title': title, 'url': url,
                              'ok': isinstance(wikitext, str) and bool(wikitext.strip()),
                              'error': parsed.get('error') if isinstance(parsed, dict) else None,
                          })
                          if not isinstance(wikitext, str) or not wikitext.strip():
                              continue
                          _, revisions = api({
                              'action': 'query', 'prop': 'revisions',
                              'titles': title,
                              'rvprop': 'ids|timestamp|sha1',
                              'rvslots': 'main', 'redirects': '1',
                              'format': 'json', 'formatversion': '2',
                          })
                          pages = revisions.get('query', {}).get('pages', [])
                          page = pages[0] if isinstance(pages, list) and pages else {}
                          revision = (page.get('revisions') or [{}])[0]
                          accepted = {
                              'group_key': group_key,
                              'title': parse.get('title', title),
                              'displaytitle': parse.get('displaytitle', ''),
                              'pageid': parse.get('pageid'),
                              'source_url': BASE + '/wiki/' + urllib.parse.quote(
                                  str(parse.get('title', title)).replace(' ', '_'), safe='/:_-'
                              ),
                              'revid': revision.get('revid'),
                              'parentid': revision.get('parentid'),
                              'timestamp': revision.get('timestamp'),
                              'wiki_sha1': revision.get('sha1'),
                              'wikitext_sha256': hashlib.sha256(
                                  wikitext.encode('utf-8')
                              ).hexdigest(),
                              'html_sha256': hashlib.sha256(
                                  str(html or '').encode('utf-8')
                              ).hexdigest(),
                              'sections': parse.get('sections') or [],
                              'wikitext': wikitext,
                              'html': html or '',
                              'attempts': attempts,
                          }
                          break
                      except Exception as error:
                          attempts.append({
                              'title': title, 'ok': False,
                              'exception': repr(error),
                          })
                  if accepted:
                      break
              if accepted:
                  (PAGES / f'{group_key}.json').write_text(
                      json.dumps(accepted, ensure_ascii=False, indent=2) + '\n',
                      encoding='utf-8',
                  )
                  records.append({
                      key: value for key, value in accepted.items()
                      if key not in {'wikitext', 'html'}
                  })
              else:
                  records.append({
                      'group_key': group_key,
                      'missing': True,
                      'attempts': attempts,
                  })
              time.sleep(0.12)

          summary = {
              'version': 1,
              'api': API,
              'candidate_count': len(SLUGS),
              'found_count': sum(not item.get('missing', False) for item in records),
              'missing_count': sum(item.get('missing', False) for item in records),
              'records': records,
          }
          (OUT / 'index.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: exedra-wiki-character-stories
          path: ${{ runner.temp }}/wiki/
          if-no-files-found: error
          retention-days: 1
