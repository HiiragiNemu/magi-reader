name: Test Magireco Reader v6

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki-preservation/static/**'
      - 'wiki-preservation/tests/production-reader-v6.mjs'
      - 'wiki-preservation/scripts/**'
      - '.github/workflows/deploy-magireco-ui-hotfix.yml'
      - '.github/workflows/test-magireco-reader-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magireco-reader-v6-production-browser
  cancel-in-progress: true

jobs:
  production-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      READER_REVISION: '6.1'
    steps:
      - name: Check out v6 production test
        uses: actions/checkout@v4
        with:
          sparse-checkout: wiki-preservation/tests/production-reader-v6.mjs
          sparse-checkout-cone-mode: true
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Prepare Reader v6.1 production regression
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('wiki-preservation/tests/production-reader-v6.mjs')
          target = source.with_name('production-reader-v61.mjs')
          text = source.read_text(encoding='utf-8')
          old = "const revision = '6.0';"
          assert text.count(old) == 1
          target.write_text(text.replace(old, "const revision = '6.1';", 1), encoding='utf-8')
          PY

      - name: Run Reader v6.1 production regression
        run: node wiki-preservation/tests/production-reader-v61.mjs

      - name: Require clean offline core-index startup
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('reader-v6-evidence/result.json').read_text(encoding='utf-8'))
          forbidden = ('/data/archive-index.json', '/data/category-index.json', '/data/portal-index.json')
          failures = [
              item for item in result.get('events', [])
              if item.get('type') == 'requestfailed'
              and any(value in item.get('url', '') for value in forbidden)
          ]
          assert not failures, failures
          registration = result.get('registration', {})
          assert '/sw-v6.1.js' in registration.get('active', ''), registration
          PY

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magireco-reader-v61-production-evidence
          path: reader-v6-evidence
          if-no-files-found: warn
          retention-days: 14
