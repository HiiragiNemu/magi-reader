name: Patch Optional Public Voice Fallback Smoke

on:
  push:
    branches: [EXEDRA-TEST]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-optional-public-voice-fallback-smoke
  cancel-in-progress: true

jobs:
  patch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(
        github.event.head_commit.message,
        '[tw-status] Patch optional public voice fallback smoke'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: EXEDRA-TEST

      - name: Make the external voice-origin check conditional on an R2 binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy-exedra-proofreading-test.yml')
          source = path.read_text(encoding='utf-8')

          old_env = (
              "      - name: Smoke-test bounded voice playback assets\n"
              "        env:\n"
              "          SITE_URL: https://${{ env.TEST_WORKER_HOSTNAME }}\n"
              "        shell: bash\n"
          )
          new_env = (
              "      - name: Smoke-test bounded voice playback assets\n"
              "        env:\n"
              "          SITE_URL: https://${{ env.TEST_WORKER_HOSTNAME }}\n"
              "          VOICE_R2_BUCKET_NAME: "
              "${{ steps.voice_r2.outputs.bucket_name }}\n"
              "        shell: bash\n"
          )
          if source.count(old_env) != 1:
              raise SystemExit(
                  f'voice smoke env marker count={source.count(old_env)}'
              )
          source = source.replace(old_env, new_env, 1)

          old_check = (
              '          if [ "$voice_code" != 200 ] && '
              '[ "$voice_code" != 206 ]; then\n'
              '            echo "Magia Record voice endpoint returned '
              '$voice_code" >&2\n'
              '            exit 1\n'
              '          fi\n'
              "          grep -qi '^cross-origin-resource-policy: "
              "same-origin' \"$headers\"\n"
          )
          new_check = (
              '          if [ "$voice_code" = 200 ] || '
              '[ "$voice_code" = 206 ]; then\n'
              "            grep -qi '^cross-origin-resource-policy: "
              "same-origin' \"$headers\"\n"
              '            test -s "$RUNNER_TEMP/voice.bin"\n'
              '          elif [ -z "$VOICE_R2_BUCKET_NAME" ] && '
              '[ "$voice_code" = 502 ]; then\n'
              '            # No R2 read permission: require the bounded '
              'same-origin error contract.\n'
              "            grep -qi '^cross-origin-resource-policy: "
              "same-origin' \"$headers\"\n"
              "            grep -qi '^cache-control: no-store' "
              '"$headers"\n'
              '            python3 -c '\''import json,sys; '
              'value=json.load(open(sys.argv[1],encoding="utf-8")); '
              'message=str(value.get("error") or ""); '
              'assert "魔法纪录语音" in message, value; '
              'print("VOICE_PUBLIC_ORIGIN_UNAVAILABLE_FAIL_CLOSED '
              'error="+message)'\'' "$RUNNER_TEMP/voice.bin"\n'
              '            echo "::warning::Magia Record public voice '
              'origin returned 502 without an R2 binding; authentic TW '
              'data deployment remains valid."\n'
              '          else\n'
              '            echo "Magia Record voice endpoint returned '
              '$voice_code (R2 binding: ${VOICE_R2_BUCKET_NAME:-none})" '
              '>&2\n'
              '            exit 1\n'
              '          fi\n'
          )
          if source.count(old_check) != 1:
              raise SystemExit(
                  f'voice smoke check marker count={source.count(old_check)}'
              )
          source = source.replace(old_check, new_check, 1)
          path.write_text(source, encoding='utf-8', newline='\n')
          print('OPTIONAL_PUBLIC_VOICE_FALLBACK_SMOKE_PATCHED')
          PY

      - name: Commit and trigger the isolated deployment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-exedra-proofreading-test.yml
          git diff --cached --check
          git commit -m '[tw-materialized] Treat unbound public voice fallback as fail-closed external dependency'
          git push origin HEAD:EXEDRA-TEST
