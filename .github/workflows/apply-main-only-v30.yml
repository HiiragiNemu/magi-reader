name: Apply main-only V30 font scope

on:
  push:
    branches:
      - work/main-only-v30-font-scope

permissions:
  contents: write

concurrency:
  group: apply-main-only-v30
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: startsWith(github.event.head_commit.message, '[main-only-v30-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/main-only-v30-font-scope

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Apply fail-closed main-only V30 migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/apply_main_only_v30.py')
          source = path.read_text(encoding='utf-8')

          old = '''    replace_once(
                  HOME,
                  'className="magi-home-search-snippet mt-0.5',
                  'className="magi-home-search-snippet reader-font-cn-body mt-0.5',
              )'''
          new = '''    replace_once(
                  HOME,
                  'className={`px-2 py-1.5 text-xs font-serif border-t ${',
                  'className={`magi-home-search-snippet reader-font-cn-body px-2 py-1.5 text-xs font-serif border-t ${',
              )'''
          if source.count(old) != 1:
              raise SystemExit('V30 migration search-snippet patch anchor drifted')
          source = source.replace(old, new, 1)

          dataset_fixes = {
              "data-exedra-font-tsuku-old-gothic='ready'":
                  "data-exedra-font-tsuku='ready'",
              "data-exedra-font-new-cinema-a='ready'":
                  "data-exedra-font-new-cinema='ready'",
          }
          for old_key, new_key in dataset_fixes.items():
              count = source.count(old_key)
              if count != 3:
                  raise SystemExit(
                      f'V30 dataset selector count drifted for {old_key}: {count}'
                  )
              source = source.replace(old_key, new_key)

          path.write_text(source, encoding='utf-8', newline='\n')
          PY

          python tools/apply_main_only_v30.py

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              source = path.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path} replacement count={count}; expected 1 for {old!r}'
                  )
              path.write_text(
                  source.replace(old, new, 1),
                  encoding='utf-8',
                  newline='\n',
              )

          community = Path('.github/workflows/community-proofreading-pr.yml')
          replace_once(
              community,
              '    branches: [EXEDRA-TEST]\n',
              '    branches: [main]\n',
          )

          configure = Path('website/scripts/configure-pages-project.mjs')
          replace_once(
              configure,
              "  PROOFREADING_TARGET_BRANCH: plainText('EXEDRA-TEST'),\n",
              "  PROOFREADING_TARGET_BRANCH: plainText('main'),\n",
          )

          materialize = Path('.github/workflows/materialize-tw-official-cn.yml')
          replace_once(
              materialize,
              'name: Materialize TW Official Simplified Chinese into EXEDRA-TEST\n',
              'name: Materialize TW Official Simplified Chinese into main\n',
          )
          replace_once(
              materialize,
              'on:\n  push:\n    branches: [EXEDRA-TEST]\n  workflow_dispatch:\n',
              'on:\n  workflow_dispatch:\n',
          )
          replace_once(
              materialize,
              '  group: materialize-tw-official-cn-exedra-test\n',
              '  group: materialize-tw-official-cn-main\n',
          )
          replace_once(materialize, '          ref: EXEDRA-TEST\n', '          ref: main\n')
          replace_once(
              materialize,
              '          git push origin HEAD:EXEDRA-TEST\n',
              '          git push origin HEAD:main\n',
          )

          proof_test = Path('website/tests/proofreading-workflow.test.mjs')
          replace_once(
              proof_test,
              "import { readFileSync } from 'node:fs';\n",
              "import { existsSync, readFileSync } from 'node:fs';\n",
          )
          replace_once(
              proof_test,
              '  assert.match(workflow, /branches:\\s*\\[EXEDRA-TEST\\]/u);\n',
              '  assert.match(workflow, /branches:\\s*\\[main\\]/u);\n',
          )
          source = proof_test.read_text(encoding='utf-8')
          start_marker = (
              "test('TW simplified test deployment is isolated, deterministic "
              "and chunk-verified', () => {"
          )
          end_marker = "test('review login presents shared team token as the simple default'"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('proofreading workflow retirement test markers drifted')
          replacement = '''test('main-only proofreading and TW materialization target production main', () => {
            const retiredWorkflow = path.resolve(
              '../.github/workflows/deploy-exedra-proofreading-test.yml',
            );
            const cleanup = read('../.github/workflows/retire-exedra-test-environment.yml');
            const materialize = read('../.github/workflows/materialize-tw-official-cn.yml');
            const configure = read('scripts/configure-pages-project.mjs');
            assert.equal(existsSync(retiredWorkflow), false);
            assert.match(cleanup, /magireader-exedra-cn-test/u);
            assert.match(cleanup, /EXEDRA-TEST/u);
            assert.match(cleanup, /git push origin --delete/u);
            assert.match(materialize, /ref:\\s*main/u);
            assert.match(materialize, /git push origin HEAD:main/u);
            assert.doesNotMatch(materialize, /branches:\\s*\\[EXEDRA-TEST\\]/u);
            assert.match(
              configure,
              /PROOFREADING_TARGET_BRANCH:\\s*plainText\\('main'\\)/u,
            );
          });

          '''
          proof_test.write_text(
              source[:start] + replacement + source[end:],
              encoding='utf-8',
              newline='\n',
          )

          for obsolete in (
              Path('.github/workflows/repair-authentic-tw.yml'),
              Path('.github/workflows/patch-voice-fallback-smoke.yml'),
          ):
              if not obsolete.is_file():
                  raise SystemExit(f'obsolete workflow is already missing: {obsolete}')
              obsolete.unlink()

          unexpected_workflow_refs = []
          for path in Path('.github/workflows').glob('*.yml'):
              if path.name == 'retire-exedra-test-environment.yml':
                  continue
              if 'EXEDRA-TEST' in path.read_text(encoding='utf-8'):
                  unexpected_workflow_refs.append(str(path))
          if unexpected_workflow_refs:
              raise SystemExit(
                  'non-retirement workflows still reference EXEDRA-TEST: '
                  + ', '.join(unexpected_workflow_refs)
              )

          unexpected_runtime_refs = []
          for root in (
              Path('website/app'),
              Path('website/lib'),
              Path('website/scripts'),
          ):
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix in {'.ts', '.tsx', '.js', '.mjs'}:
                      if 'EXEDRA-TEST' in path.read_text(encoding='utf-8'):
                          unexpected_runtime_refs.append(str(path))
          if unexpected_runtime_refs:
              raise SystemExit(
                  'runtime files still reference EXEDRA-TEST: '
                  + ', '.join(unexpected_runtime_refs)
              )
          PY

          git diff --check
          git status --short

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-compile -r requirements-data-tools.txt
          npm --prefix website ci

      - name: Rebuild committed data and materialize search chunks
        shell: bash
        run: |
          set -euo pipefail
          cp website/public/story_index.json "$RUNNER_TEMP/story_index.committed.json"
          for scope in magireco exedra; do
            cp "website/public/search_index_manifest.$scope.json" \
              "$RUNNER_TEMP/search_index_manifest.$scope.committed.json"
          done

          python generate_story_index.py
          python tools/apply_tw_official_metadata.py
          python generate_machine_translation_manifest.py \
            --translation-base 65f221f2aaa5a9fe161ed32e03e4dfbb93d4746d \
            --translation-commit 3d463befe7a10d4cb72034378ce2a6f23c377abb
          python tools/build_split_search_indexes.py
          python tools/build_split_search_indexes.py --validate-only

          cmp "$RUNNER_TEMP/story_index.committed.json" website/public/story_index.json
          for scope in magireco exedra; do
            cmp \
              "$RUNNER_TEMP/search_index_manifest.$scope.committed.json" \
              "website/public/search_index_manifest.$scope.json"
          done

          python tools/search_chunk_delivery.py materialize
          python tools/search_chunk_delivery.py verify-tree --root website/public

      - name: Run complete repository checks
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix website run check
          python generate_story_index.py --validate-only

      - name: Build and verify Cloudflare output
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix website run build:worker
          npm --prefix website run verify:cloudflare-output
          python tools/search_chunk_delivery.py verify-tree --root website/.open-next/assets

      - name: Commit validated main-only V30 tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_main_only_v30.py .github/workflows/apply-main-only-v30.yml
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'V30 migration produced no durable changes.' >&2
            exit 1
          fi
          git commit -m '[main-only-v30] Global game font scope and retire EXEDRA test'
          git push origin HEAD:work/main-only-v30-font-scope
