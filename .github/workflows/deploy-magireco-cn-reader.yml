name: Deploy Magireco Chinese Preservation Reader

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki-preservation/scripts/build_html_snapshot.py'
      - 'wiki-preservation/scripts/build_html_snapshot_parallel.py'
      - 'wiki-preservation/scripts/build_compressed_snapshot.py'
      - 'wiki-preservation/scripts/patch_static_app.py'
      - '.github/workflows/deploy-magireco-cn-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magireco-cn-reader-cloudflare
  cancel-in-progress: true

jobs:
  snapshot-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Check out preservation deployment files
        uses: actions/checkout@v4
        with:
          sparse-checkout: wiki-preservation
          sparse-checkout-cone-mode: true
          show-progress: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml bleach

      - name: Build 500-page rate-limited parallel snapshot
        run: |
          python wiki-preservation/scripts/build_html_snapshot_parallel.py \
            --output wiki-preservation/dist \
            --max-pages 500 \
            --max-requests 1600 \
            --minimum-pages 300 \
            --workers 6 \
            --pause 0.12 \
            --timeout 12 \
            --retries 3
          python wiki-preservation/scripts/patch_static_app.py wiki-preservation/dist/app.js

      - name: Verify preservation snapshot only
        shell: bash
        run: |
          set -euo pipefail
          test -f wiki-preservation/dist/index.html
          test -f wiki-preservation/dist/data/runtime-manifest.json
          test -f wiki-preservation/dist/data/archive-index.json
          test -f wiki-preservation/dist/health.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('wiki-preservation/dist')
          manifest = json.loads((root / 'data/runtime-manifest.json').read_text(encoding='utf-8'))
          counts = manifest['counts']
          assert counts['pages'] >= 300, counts
          assert counts['shards'] >= 100, counts
          assert counts['media'] >= 500, counts
          files = [path for path in root.rglob('*') if path.is_file()]
          oversized = [path for path in files if path.stat().st_size > 25 * 1024 * 1024]
          assert len(files) <= 20000, len(files)
          assert not oversized, [(str(path), path.stat().st_size) for path in oversized]
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload preservation snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: magireco-cn-reader-preservation-snapshot
          path: wiki-preservation/dist
          if-no-files-found: error
          retention-days: 14

      - name: Preserve only; structured workflow owns production deployment
        run: |
          echo 'Snapshot generation completed.'
          echo 'Production Cloudflare deployment is owned by Deploy Magireco Structured Reader v5.'
