name: Deploy Magireco Chinese Preservation Reader

on:
  push:
    branches: [deploy/magireco-cn-reader]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magireco-cn-reader-cloudflare-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  snapshot-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Check out preservation deployment files
        uses: actions/checkout@v4
        with:
          sparse-checkout: wiki-preservation
          sparse-checkout-cone-mode: true
          show-progress: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml bleach

      - name: Build 20-page rendered HTML deployment sample
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('wiki-preservation/scripts/build_html_snapshot.py')
          text = path.read_text(encoding='utf-8')
          old = 'if len(crawler.records) < 1000:'
          new = 'if len(crawler.records) < 10:'
          if old not in text:
              raise SystemExit('minimum-page guard not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python wiki-preservation/scripts/build_html_snapshot.py \
            --output wiki-preservation/dist \
            --max-pages 20 \
            --max-requests 80 \
            --pause 0.03

      - name: Verify sample and hosting limits
        shell: bash
        run: |
          set -euo pipefail
          test -f wiki-preservation/dist/index.html
          test -f wiki-preservation/dist/data/runtime-manifest.json
          test -f wiki-preservation/dist/data/archive-index.json
          test -f wiki-preservation/dist/data/media-index.json
          test -f wiki-preservation/dist/health.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('wiki-preservation/dist')
          manifest = json.loads((root / 'data/runtime-manifest.json').read_text(encoding='utf-8'))
          counts = manifest['counts']
          assert counts['pages'] >= 10, counts
          assert counts['shards'] >= 8, counts
          assert counts['media'] >= 5, counts
          files = [path for path in root.rglob('*') if path.is_file()]
          oversized = [path for path in files if path.stat().st_size > 25 * 1024 * 1024]
          assert len(files) <= 20000, len(files)
          assert not oversized, [(str(path), path.stat().st_size) for path in oversized]
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          print(f'deployment files: {len(files)}')
          print(f'deployment bytes: {sum(path.stat().st_size for path in files)}')
          PY

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: magireco-cn-reader-20-page-deployment-sample
          path: wiki-preservation/dist
          if-no-files-found: error
          retention-days: 14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare credentials
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx --yes wrangler@latest whoami

      - name: Create Cloudflare Pages project when missing
        shell: bash
        run: |
          set -euo pipefail
          projects=$(npx --yes wrangler@latest pages project list --json)
          if ! printf '%s' "$projects" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const a=JSON.parse(s);process.exit(a.some(x=>x.name==="magireco-cn-reader")?0:1)})'; then
            npx --yes wrangler@latest pages project create magireco-cn-reader --production-branch main
          fi

      - name: Deploy production site
        run: |
          npx --yes wrangler@latest pages deploy wiki-preservation/dist \
            --project-name magireco-cn-reader \
            --branch main \
            --commit-dirty=true

      - name: Verify public deployment
        shell: bash
        run: |
          set -euo pipefail
          url='https://magireco-cn-reader.pages.dev/health.json'
          for attempt in $(seq 1 40); do
            if body=$(curl --fail --silent --show-error --max-time 20 "$url"); then
              echo "$body"
              echo "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const x=JSON.parse(s);if(x.status!=="ok"||x.readerVersion!==3)process.exit(1)})'
              echo 'Published: https://magireco-cn-reader.pages.dev/#/portal'
              exit 0
            fi
            echo "Waiting for deployment ($attempt/40)..."
            sleep 8
          done
          exit 1
