name: Apply Reader UI V27

on:
  push:
    branches: [work/reader-ui-v27]

permissions:
  contents: write

concurrency:
  group: apply-reader-ui-v27
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: startsWith(github.event.head_commit.message, '[ui-v27-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/reader-ui-v27

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Apply final accessibility contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          page = Path('website/app/page.tsx')
          value = page.read_text(encoding='utf-8')
          target = (
              '          className={`magi-home-mobile-review-button md:hidden ${\n'
          )
          replacement = (
              '          className={`magi-home-mobile-review-button transition md:hidden '
              'focus-visible:outline-none focus-visible:ring-2 '
              'focus-visible:ring-amber-500 ${\n'
          )
          if value.count(target) != 1:
              raise SystemExit(
                  f'mobile review button class marker count={value.count(target)}; expected 1'
              )
          page.write_text(
              value.replace(target, replacement, 1),
              encoding='utf-8',
              newline='\n',
          )
          PY
          git diff --check
          git status --short

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-compile -r requirements-data-tools.txt
          npm --prefix website ci

      - name: Run complete repository checks
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix website run check
          python generate_story_index.py --validate-only
          python tools/build_split_search_indexes.py --validate-only
          python tools/search_chunk_delivery.py verify-tree --root website/public

      - name: Build and verify Cloudflare output
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix website run build:worker
          npm --prefix website run verify:cloudflare-output
          python tools/search_chunk_delivery.py verify-tree --root website/.open-next/assets

      - name: Commit validated V27 tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_reader_ui_v27.py .github/workflows/apply-reader-ui-v27.yml
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Validated V27 tree produced no durable changes.' >&2
            exit 1
          fi
          git commit -m '[tw-materialized] Reader UI V27 compact dock navigation and synchronized sidebar'
          git push origin HEAD:work/reader-ui-v27
