name: Apply Reader UI V27

on:
  push:
    branches: [work/reader-ui-v27]

permissions:
  contents: write

concurrency:
  group: apply-reader-ui-v27
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: startsWith(github.event.head_commit.message, '[ui-v27-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/reader-ui-v27

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Apply fail-closed V27 migration
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_reader_ui_v27.py
          python - <<'PY'
          from pathlib import Path
          import re

          css = Path('website/app/ui-refinements.css')
          css_value = css.read_text(encoding='utf-8')
          css.write_text(css_value.rstrip() + '\n', encoding='utf-8', newline='\n')

          page = Path('website/app/page.tsx')
          page_value = page.read_text(encoding='utf-8')
          hydration_target = '        setMobileReviewPlacement(stored);\n'
          hydration_replacement = (
              '        // This one-time client preference hydration intentionally runs after mount.\n'
              '        // eslint-disable-next-line react-hooks/set-state-in-effect\n'
              '        setMobileReviewPlacement(stored);\n'
          )
          if page_value.count(hydration_target) != 1:
              raise SystemExit('mobile review placement hydration marker is not unique')
          page.write_text(
              page_value.replace(hydration_target, hydration_replacement, 1),
              encoding='utf-8',
              newline='\n',
          )

          reader = Path('website/app/reader/[id]/page.tsx')
          reader_value = reader.read_text(encoding='utf-8')

          def guard_optional_index(value: str, variable: str) -> str:
              pattern = re.compile(
                  rf'(?m)^(?P<indent>[ \t]*)onClick=\{{\(\) => '
                  rf'goToSection\({variable}\)\}}\n'
                  rf'(?P=indent)disabled=\{{{variable} < 0\}}'
              )

              def replace(match: re.Match[str]) -> str:
                  indent = match.group('indent')
                  child = indent + '  '
                  grandchild = child + '  '
                  return '\n'.join((
                      f'{indent}onClick={{() => {{',
                      f'{child}if (',
                      f'{grandchild}{variable} !== undefined',
                      f'{grandchild}&& {variable} >= 0',
                      f'{child}) {{',
                      f'{grandchild}goToSection({variable});',
                      f'{child}}}',
                      f'{indent}}}}}',
                      f'{indent}disabled={{',
                      f'{child}{variable} === undefined',
                      f'{child}|| {variable} < 0',
                      f'{indent}}}',
                  ))

              updated, count = pattern.subn(replace, value)
              if count not in {1, 2}:
                  raise SystemExit(
                      f'section navigation {variable} guard count={count}; expected 1 or 2'
                  )
              return updated

          reader_value = guard_optional_index(
              reader_value,
              'previousSectionIndex',
          )
          reader_value = guard_optional_index(
              reader_value,
              'nextSectionIndex',
          )
          reader.write_text(reader_value, encoding='utf-8', newline='\n')
          PY
          git diff --check
          git status --short

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-compile -r requirements-data-tools.txt
          npm --prefix website ci

      - name: Run complete repository checks
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix website run check
          python generate_story_index.py --validate-only
          python tools/build_split_search_indexes.py --validate-only
          python tools/search_chunk_delivery.py verify-tree --root website/public

      - name: Build and verify Cloudflare output
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix website run build:worker
          npm --prefix website run verify:cloudflare-output
          python tools/search_chunk_delivery.py verify-tree --root website/.open-next/assets

      - name: Commit validated V27 tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_reader_ui_v27.py .github/workflows/apply-reader-ui-v27.yml
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'V27 migration produced no durable changes.' >&2
            exit 1
          fi
          git commit -m '[tw-materialized] Reader UI V27 compact dock navigation and synchronized sidebar'
          git push origin HEAD:work/reader-ui-v27
