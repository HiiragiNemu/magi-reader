name: Apply Reader UI V28

on:
  push:
    branches:
      - work/reader-ui-v28-floating-widgets

permissions:
  contents: write

concurrency:
  group: apply-reader-ui-v28
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: startsWith(github.event.head_commit.message, '[ui-v28-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/reader-ui-v28-floating-widgets

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Apply fail-closed V28 migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/apply_reader_ui_v28.py')
          source = path.read_text(encoding='utf-8')
          old = (
              '    replace_between(\n'
              '        READER,\n'
              '        "          {!loadError && utilityPanelOpen && (\\n",\n'
              '        "        <main\\n",\n'
              '        utility_widget,\n'
              '    )\n'
          )
          new = (
              '    replace_between(\n'
              '        READER,\n'
              '        "          {!loadError && utilityPanelOpen && (\\n",\n'
              '        "          className={`magi-reader-main ",\n'
              '        utility_widget,\n'
              '    )\n'
          )
          if source.count(old) != 1:
              raise SystemExit(
                  'V28 utility migration source anchor is not unique; '
                  'refusing to guess the final Reader main element'
              )
          path.write_text(
              source.replace(old, new, 1),
              encoding='utf-8',
              newline='\n',
          )
          PY

          python tools/apply_reader_ui_v28.py

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              source = path.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path} replacement count={count}; expected 1 for {old!r}'
                  )
              path.write_text(
                  source.replace(old, new, 1),
                  encoding='utf-8',
                  newline='\n',
              )

          bilingual = Path('website/tests/bilingual-layout.test.mjs')
          replace_once(
              bilingual,
              '  assert.match(preferences, /DEFAULT_READER_TEXT_WIDTH = 768/u);\n',
              '  assert.match(preferences, /DEFAULT_READER_TEXT_WIDTH = 1024/u);\n',
          )
          replace_once(
              bilingual,
              '  assert.match(preferences, /READER_TEXT_WIDTH_MIN = 640/u);\n',
              '  assert.match(preferences, /READER_TEXT_WIDTH_MIN = 320/u);\n',
          )

          visual = Path('website/tests/reader-visual-controls.test.mjs')
          replace_once(
              visual,
              '  assert.match(reader, /aria-label="关闭阅读导航栏"/);\n',
              '  assert.match(reader, /aria-label="收起阅读导航"/);\n',
          )

          reader = Path('website/app/reader/[id]/page.tsx')
          source = reader.read_text(encoding='utf-8')
          if '        <main\n        <main\n' in source:
              raise SystemExit('V28 generated a duplicated Reader main marker')
          if source.count('className={`magi-reader-main ') != 1:
              raise SystemExit('V28 Reader main element count is not exactly one')
          utility_markup = 'className={`magi-reader-utility-widget ${'
          if source.count(utility_markup) != 1:
              raise SystemExit('V28 rendered utility widget count is not exactly one')
          if source.index('const renderList = useMemo(') > source.index(
              utility_markup
          ):
              raise SystemExit(
                  'V28 floating utility was emitted before render state declarations'
              )

          css = Path('website/app/ui-refinements.css')
          css.write_text(
              css.read_text(encoding='utf-8').rstrip() + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY

          git diff --check
          git status --short

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-compile -r requirements-data-tools.txt
          npm --prefix website ci

      - name: Run complete repository checks
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix website run check
          python generate_story_index.py --validate-only
          python tools/build_split_search_indexes.py
          python tools/build_split_search_indexes.py --validate-only
          python tools/search_chunk_delivery.py verify-tree --root website/public

      - name: Build and verify Cloudflare output
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix website run build:worker
          npm --prefix website run verify:cloudflare-output
          python tools/search_chunk_delivery.py verify-tree --root website/.open-next/assets

      - name: Commit validated V28 tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_reader_ui_v28.py .github/workflows/apply-reader-ui-v28.yml
          rm -rf artifacts/search-split
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'V28 migration produced no durable changes.' >&2
            exit 1
          fi
          git commit -m '[tw-materialized] Reader UI V28 draggable floating controls and full-width mobile reader'
          git push origin HEAD:work/reader-ui-v28-floating-widgets
