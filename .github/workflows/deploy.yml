name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./website

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Deploy (Execute Local Script Logic)
        env:
          # 必须注入环境变量，否则内部的 wrangler 无法登录
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # 1. 清理缓存 (对应本地的 rm -r -fo，Linux下为 rm -rf)
          rm -rf .next .open-next
          
          # 2. 执行你本地成功的脚本
          # 这将直接调用 package.json 中的 deploy:pages 命令
          # 并传递必要的非交互参数以防止 CI 卡住 (如需指定项目名)
          npm run deploy:pages -- --branch=main --project-name=magireader