name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pages_branch:
        description: Pages preview branch (main deploys production)
        required: true
        default: promotion-current
        type: string
  workflow_call:
    inputs:
      pages_branch:
        description: Pages branch; main deploys production
        required: false
        default: main
        type: string
      source_ref:
        description: Exact Reader commit produced by the calling workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-pages-${{ github.event_name == 'push' && 'main' || inputs.pages_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name != 'push' ||
      (!startsWith(github.event.head_commit.message, '[tw-materialized]') &&
      !startsWith(github.event.head_commit.message, '[jp-materialized]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ./website
    env:
      PAGES_PROJECT_NAME: magireader
      PROOFREADING_KV_TITLE: magi-submissions
      PAGES_BRANCH: ${{ github.event_name == 'push' && 'main' || inputs.pages_branch }}
      PAGES_ENVIRONMENT: ${{ (github.event_name == 'push' || inputs.pages_branch == 'main') && 'production' || 'preview' }}
      SOURCE_COMMIT_SHA: ${{ inputs.source_ref || github.sha }}
      SERVER_GITHUB_TOKEN: ${{ secrets.PROOFREADING_GITHUB_TOKEN || secrets.TARGET_REPO_TOKEN }}
      SHARED_ADMIN_TOKEN: ${{ secrets.SUBMISSIONS_ADMIN_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The trusted-main machine-review generator verifies ancestry and
          # compares Git trees against the immutable main baseline below.
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Verify exact deploy source
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$SOURCE_COMMIT_SHA" || {
            echo "::error::Deploy checkout $actual differs from $SOURCE_COMMIT_SHA"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: npm ci

      - name: Run complete checks
        run: npm run check

      - name: Generate deployable story catalogue and machine review baseline
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python generate_story_index.py
          python tools/apply_tw_official_metadata.py
          python generate_machine_translation_manifest.py \
            --translation-base 65f221f2aaa5a9fe161ed32e03e4dfbb93d4746d \
            --translation-commit 3d463befe7a10d4cb72034378ce2a6f23c377abb
          python tools/build_split_search_indexes.py
          python tools/build_split_search_indexes.py --validate-only
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("website/public/data/machine_translation_manifest.generated.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          entries = manifest.get("entries")
          if (
              not isinstance(entries, list)
              or not entries
              or manifest.get("total") != len(entries)
          ):
              raise SystemExit(
                  f"invalid machine-review manifest: total={manifest.get('total')!r} "
                  f"entries={type(entries).__name__}"
              )
          print(f"machine-review baseline ready: {manifest['total']}")
          PY

      - name: Resolve Turnstile credentials
        id: turnstile
        env:
          REAL_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          REAL_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$REAL_SITE_KEY" ] && [ -n "$REAL_SECRET_KEY" ]; then
            site_key="$REAL_SITE_KEY"
            secret_key="$REAL_SECRET_KEY"
            test_mode=false
          else
            site_key='1x00000000000000000000AA'
            secret_key='1x0000000000000000000000000000000AA'
            test_mode=true
            echo "::warning::Using Cloudflare Turnstile test keys. Configure TURNSTILE_SITE_KEY and TURNSTILE_SECRET_KEY before public launch."
          fi
          echo "site_key=$site_key" >> "$GITHUB_OUTPUT"
          echo "test_mode=$test_mode" >> "$GITHUB_OUTPUT"
          echo "TURNSTILE_SECRET_KEY_VALUE=$secret_key" >> "$GITHUB_ENV"
          echo "::add-mask::$secret_key"

      - name: Build safe Pages advanced-mode output
        run: npm run build:pages

      - name: Resolve proofreading KV namespace
        id: kv
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CONFIGURED_NAMESPACE_ID: ${{ secrets.SUBMISSIONS_KV_NAMESPACE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$CONFIGURED_NAMESPACE_ID" ]; then
            if ! [[ "$CONFIGURED_NAMESPACE_ID" =~ ^[a-f0-9]{32}$ ]]; then
              echo "::error::SUBMISSIONS_KV_NAMESPACE_ID is not a 32-character ID."
              exit 1
            fi
            echo "namespace_id=$CONFIGURED_NAMESPACE_ID" >> "$GITHUB_OUTPUT"
          else
            python scripts/proofreading_queue.py namespace \
              --title "$PROOFREADING_KV_TITLE" \
              --create
          fi

      - name: Verify server implementation is not exposed as public assets
        shell: bash
        run: |
          set -euo pipefail
          test -f .pages-deploy/_worker.js
          for forbidden in app-worker.js server-functions middleware cloudflare .build; do
            if find .pages-deploy -mindepth 1 -maxdepth 2 -name "$forbidden" -print -quit | grep -q .; then
              echo "::error::Unsafe Pages public asset: $forbidden"
              exit 1
            fi
          done

      - name: Configure Pages Functions bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SUBMISSIONS_KV_NAMESPACE_ID: ${{ steps.kv.outputs.namespace_id }}
          TURNSTILE_SITE_KEY: ${{ steps.turnstile.outputs.site_key }}
          TURNSTILE_SECRET_KEY: ${{ env.TURNSTILE_SECRET_KEY_VALUE }}
          TURNSTILE_TEST_MODE: ${{ steps.turnstile.outputs.test_mode }}
          TURNSTILE_ALLOWED_HOSTNAMES: >-
            magireader.pages.dev,${{ env.PAGES_BRANCH }}.magireader.pages.dev
          PROOFREADING_GITHUB_TOKEN: ${{ env.SERVER_GITHUB_TOKEN }}
          SUBMISSIONS_ADMIN_TOKEN: ${{ env.SHARED_ADMIN_TOKEN }}
          DEPLOY_SOURCE_SHA: ${{ env.SOURCE_COMMIT_SHA }}
        run: node scripts/configure-pages-project.mjs

      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy .pages-deploy
          --project-name "$PAGES_PROJECT_NAME"
          --branch "$PAGES_BRANCH"
          --commit-hash "$SOURCE_COMMIT_SHA"
          --commit-message "MagiReader $SOURCE_COMMIT_SHA"

      - name: Smoke test Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PAGES_ENVIRONMENT" = production ]; then
            base='https://magireader.pages.dev'
          else
            base="https://${PAGES_BRANCH}.magireader.pages.dev"
          fi
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 30 "$base/" >/tmp/home.html &&
               curl --fail --silent --show-error --max-time 30 "$base/story_index.json" >/tmp/story_index.json &&
               curl --fail --silent --show-error --max-time 30 "$base/api/proofreading/config" >/tmp/config.json &&
               curl --fail --silent --show-error --max-time 30 "$base/api/proofreading/machine-status" >/tmp/status.json &&
               curl --fail --silent --show-error --max-time 30 "$base/data/machine_translation_manifest.generated.json" >/tmp/machine_manifest.json &&
               curl --fail --silent --show-error --max-time 30 "$base/data/exedra_character/character_asuka/character_asuka_cn.txt" >/tmp/asuka.txt &&
               curl --fail --silent --show-error --max-time 30 "$base/data/exedra_character/character_asuka/character_asuka_0.json" >/tmp/asuka.json &&
               node --input-type=module -e '
                 import fs from "node:fs";
                 const config = JSON.parse(fs.readFileSync("/tmp/config.json", "utf8"));
                 process.exit(config.source_revision === process.env.SOURCE_COMMIT_SHA ? 0 : 1);
               '; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::Pages smoke test did not become healthy."
              exit 1
            fi
            sleep 10
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const index = JSON.parse(fs.readFileSync('/tmp/story_index.json', 'utf8'));
          const config = JSON.parse(fs.readFileSync('/tmp/config.json', 'utf8'));
          const status = JSON.parse(fs.readFileSync('/tmp/status.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('/tmp/machine_manifest.json', 'utf8'));
          const asuka = JSON.parse(fs.readFileSync('/tmp/asuka.json', 'utf8'));
          if (!Array.isArray(index) || index.length === 0) throw new Error('story index is incomplete');
          if (config.source_revision !== process.env.SOURCE_COMMIT_SHA) throw new Error('source revision mismatch');
          if (!Array.isArray(manifest.entries) || manifest.entries.length === 0 || manifest.total !== manifest.entries.length) throw new Error('machine manifest mismatch');
          if (!Number.isInteger(status.total) || !Number.isInteger(status.remaining) || status.total !== manifest.total || status.remaining < 0 || status.remaining > status.total) throw new Error('machine review status mismatch');
          if (!fs.readFileSync('/tmp/asuka.txt', 'utf8').includes('[Section')) throw new Error('Asuka TXT is incomplete');
          if (!Array.isArray(asuka.sheetList) || asuka.sheetList.length < 1) throw new Error('Asuka JSON is incomplete');
          console.log(JSON.stringify({
            site: process.env.PAGES_ENVIRONMENT === 'production'
              ? 'https://magireader.pages.dev'
              : `https://${process.env.PAGES_BRANCH}.magireader.pages.dev`,
            stories: index.length,
            machineTotal: status.total,
            sourceRevision: config.source_revision,
          }));
          NODE
