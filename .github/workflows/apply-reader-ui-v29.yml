name: Apply Reader UI V29

on:
  push:
    branches:
      - work/reader-ui-v29-compact-theme-switcher

permissions:
  contents: write

concurrency:
  group: apply-reader-ui-v29
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: startsWith(github.event.head_commit.message, '[ui-v29-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/reader-ui-v29-compact-theme-switcher

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Apply fail-closed V29 migration
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_reader_ui_v29.py
          git diff --check
          git status --short

      - name: Install deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-compile -r requirements-data-tools.txt
          npm --prefix website ci

      - name: Run complete repository checks
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix website run check
          python generate_story_index.py --validate-only
          python tools/build_split_search_indexes.py --validate-only
          python tools/search_chunk_delivery.py verify-tree --root website/public

      - name: Build and verify Cloudflare output
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix website run build:worker
          npm --prefix website run verify:cloudflare-output
          python tools/search_chunk_delivery.py verify-tree --root website/.open-next/assets

      - name: Commit validated V29 tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_reader_ui_v29.py .github/workflows/apply-reader-ui-v29.yml
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'V29 migration produced no durable changes.' >&2
            exit 1
          fi
          git commit -m '[tw-materialized] Reader UI V29 compact utility theme switcher'
          git push origin HEAD:work/reader-ui-v29-compact-theme-switcher
