name: Verify Trusted Live Machine Status

on:
  pull_request:
    branches:
      - tooling/verify-trusted-live-base

permissions:
  contents: read

jobs:
  verify-live:
    if: >-
      github.event.pull_request.head.ref == 'tooling/verify-trusted-live-run' &&
      github.event.pull_request.base.ref == 'tooling/verify-trusted-live-base'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://magireader-exedra-cn-test.crynetsystemscell.workers.dev
      EXPECTED_TOTAL: "507"
    steps:
      - name: Wait for corrected Worker and verify category boundary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected_commit="$(gh api \
            repos/${{ github.repository }}/git/ref/heads/feature/community-proofreading-workflow \
            --jq '.object.sha')"
          echo "EXPECTED_FEATURE_COMMIT=$expected_commit"
          for attempt in $(seq 1 60); do
            config_code="$(curl -L --silent --show-error \
              -o "$RUNNER_TEMP/config.json" -w '%{http_code}' \
              "$SITE_URL/api/proofreading/config")"
            machine_code="$(curl -L --silent --show-error \
              -o "$RUNNER_TEMP/machine.json" -w '%{http_code}' \
              "$SITE_URL/api/proofreading/machine-status")"
            if [ "$config_code" = 200 ] && [ "$machine_code" = 200 ]; then
              result="$(python3 - "$RUNNER_TEMP/config.json" "$RUNNER_TEMP/machine.json" "$expected_commit" "$EXPECTED_TOTAL" <<'PY'
          import json
          import sys
          from pathlib import Path

          config = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          machine = json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          expected_commit = sys.argv[3]
          expected_total = int(sys.argv[4])
          ok = (
              config.get('source_revision') == expected_commit
              and machine.get('total') == expected_total
              and machine.get('remaining') == expected_total - machine.get('verified', 0)
              and len(machine.get('machine_translation_ids', [])) == expected_total
              and machine.get('definition') == 'magireco_cn_txt_absent_from_trusted_main'
          )
          print('ready' if ok else (
              f"pending source={config.get('source_revision')} "
              f"total={machine.get('total')} definition={machine.get('definition')}"
          ))
          PY
              )"
              echo "attempt=$attempt $result"
              if [ "$result" = ready ]; then
                break
              fi
            else
              echo "attempt=$attempt config_http=$config_code machine_http=$machine_code"
            fi
            if [ "$attempt" -eq 60 ]; then
              echo 'Corrected Worker did not propagate within timeout' >&2
              exit 1
            fi
            sleep 5
          done

          curl --fail --silent --show-error \
            "$SITE_URL/story_index.json" -o "$RUNNER_TEMP/story-index.json"
          curl --fail --silent --show-error \
            "$SITE_URL/" -o "$RUNNER_TEMP/home.html"
          curl --fail --silent --show-error \
            "$SITE_URL/review/machine-translations" \
            -o "$RUNNER_TEMP/machine-review.html"
          python3 - "$RUNNER_TEMP/config.json" "$RUNNER_TEMP/machine.json" "$RUNNER_TEMP/story-index.json" "$RUNNER_TEMP/home.html" "$RUNNER_TEMP/machine-review.html" "$expected_commit" <<'PY'
          import json
          import sys
          from pathlib import Path

          config = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          machine = json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          stories = json.loads(Path(sys.argv[3]).read_text(encoding='utf-8'))
          home = Path(sys.argv[4]).read_text(encoding='utf-8', errors='replace')
          review = Path(sys.argv[5]).read_text(encoding='utf-8', errors='replace')
          expected_commit = sys.argv[6]

          machine_ids = set(map(str, machine.get('machine_translation_ids', [])))
          forbidden_categories = {'main_story', 'scene0_main'}
          forbidden = [
              {
                  'id': str(story.get('id')),
                  'category': story.get('category'),
                  'title': story.get('title'),
              }
              for story in stories
              if str(story.get('id')) in machine_ids
              and story.get('category') in forbidden_categories
          ]
          if forbidden:
              raise SystemExit(f'Main-line stories remain machine-marked: {forbidden[:20]}')
          if machine.get('total') != 507:
              raise SystemExit(f'Unexpected corrected total: {machine.get("total")}')
          if config.get('source_revision') != expected_commit:
              raise SystemExit('Live source revision is stale')
          if machine.get('definition') != 'magireco_cn_txt_absent_from_trusted_main':
              raise SystemExit(f'Unexpected live definition: {machine.get("definition")}')
          if 'states' in machine:
              raise SystemExit('Public API leaked private review states')
          if min(len(home), len(review)) < 500:
              raise SystemExit('Live pages are incomplete')
          print(
              'TRUSTED_LIVE_MACHINE_STATUS_OK '
              f'commit={expected_commit} total={machine["total"]} '
              f'verified={machine["verified"]} remaining={machine["remaining"]} '
              f'main_line_intersection={len(forbidden)} stories={len(stories)}'
          )
          PY
