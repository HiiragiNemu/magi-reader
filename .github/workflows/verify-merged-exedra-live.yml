name: Verify Merged EXEDRA Live

on:
  pull_request:
    branches:
      - tooling/verify-merged-live-base

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event.pull_request.head.ref == 'tooling/verify-merged-live-run' &&
      github.event.pull_request.base.ref == 'tooling/verify-merged-live-base'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch verifier
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet .
          git remote add origin https://github.com/${{ github.repository }}.git
          git -c protocol.version=2 fetch --quiet origin \
            tooling/verify-merged-live-base
          git show \
            origin/tooling/verify-merged-live-base:scripts/verify_merged_live.py \
            > "$RUNNER_TEMP/verify_merged_live.py"

      - name: Wait for merged deployment and verify
        run: python3 "$RUNNER_TEMP/verify_merged_live.py"
