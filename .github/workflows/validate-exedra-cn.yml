name: Validate Exedra CN Integration

on:
  pull_request:
    branches:
      - codex/exedra-cn-full-validation-base

permissions:
  contents: read

concurrency:
  group: validate-exedra-cn-full-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Run Python data-pipeline tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Rebuild and validate story data in temporary staging
        run: python generate_story_index.py --dry-run

      - name: Lint
        working-directory: website
        run: npm run lint

      - name: Type check
        working-directory: website
        run: npm run type-check

      - name: Run website tests
        working-directory: website
        run: npm test

      - name: Build and validate search index
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/magi-reader-search"
          payload="$RUNNER_TEMP/magi-reader-search/search_content.json"
          python build_search_index_v6.py --output "$payload"
          python build_search_index_v6.py --output "$payload" --validate-only

      - name: Build Cloudflare Worker output
        working-directory: website
        run: npm run build:worker
