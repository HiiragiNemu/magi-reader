name: Verify Magireco Memoria Sample

on:
  pull_request:
    branches: [main]
    paths:
      - 'memoria-crawl/**'
      - '.github/workflows/verify-magireco-memoria-sample.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magireco-memoria-sample
  cancel-in-progress: true

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Check out crawler and restricted proxy
        uses: actions/checkout@v4
        with:
          sparse-checkout: memoria-crawl
          sparse-checkout-cone-mode: true
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Prepare temporary allow-listed edge proxy
        shell: bash
        run: |
          set -euo pipefail
          project="magireco-memoria-${GITHUB_RUN_ID}"
          token="$(openssl rand -hex 24)"
          proxy="https://${project}.pages.dev"
          mkdir -p memoria-proxy-dist proxy-diagnostic
          python - <<PY
          from pathlib import Path
          source = Path('memoria-crawl/proxy-worker.js').read_text(encoding='utf-8')
          token = '${token}'
          assert '__PROXY_TOKEN__' in source
          rendered = source.replace('__PROXY_TOKEN__', token)
          Path('memoria-proxy-dist/_worker.js').write_text(rendered, encoding='utf-8')
          PY
          node --check memoria-proxy-dist/_worker.js
          echo "MEMORIA_PROXY_PROJECT=$project" >> "$GITHUB_ENV"
          echo "MAGIRECO_FETCH_PROXY=$proxy" >> "$GITHUB_ENV"
          echo "MAGIRECO_PROXY_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Create temporary Pages project
        id: create_proxy_project
        shell: bash
        run: |
          set +e
          npx --yes wrangler@latest pages project create "$MEMORIA_PROXY_PROJECT" --production-branch main \
            > proxy-diagnostic/wrangler-project-create.log 2>&1
          code=$?
          cat proxy-diagnostic/wrangler-project-create.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Deploy temporary Pages Worker
        id: deploy_proxy_worker
        if: steps.create_proxy_project.outcome == 'success'
        shell: bash
        run: |
          set +e
          npx --yes wrangler@latest pages deploy memoria-proxy-dist \
            --project-name "$MEMORIA_PROXY_PROJECT" \
            --branch main \
            --commit-dirty=true \
            > proxy-diagnostic/wrangler-pages-deploy.log 2>&1
          code=$?
          cat proxy-diagnostic/wrangler-pages-deploy.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Wait for temporary proxy
        if: steps.deploy_proxy_worker.outcome == 'success'
        shell: bash
        run: |
          set +e
          for attempt in $(seq 1 40); do
            status="$(curl --silent --show-error -o proxy-diagnostic/health.json -w '%{http_code}' "$MAGIRECO_FETCH_PROXY/health" || true)"
            printf '%s\n' "$status" > proxy-diagnostic/health-status.txt
            if [ "$status" = 200 ] && grep -q 'magireco-rendered-pages-only' proxy-diagnostic/health.json; then
              exit 0
            fi
            sleep 3
          done
          cat proxy-diagnostic/health-status.txt || true
          cat proxy-diagnostic/health.json || true
          exit 1

      - name: Probe source paths through edge proxy
        if: steps.deploy_proxy_worker.outcome == 'success'
        shell: bash
        run: |
          set -uo pipefail
          probe() {
            name="$1"
            target="$2"
            encoded="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$target")"
            status="$(curl --silent --show-error \
              -D "proxy-diagnostic/${name}.headers.txt" \
              -o "proxy-diagnostic/${name}.body.html" \
              -w '%{http_code}' \
              -H "x-magireco-proxy-token: $MAGIRECO_PROXY_TOKEN" \
              "$MAGIRECO_FETCH_PROXY/?url=$encoded" || true)"
            printf '%s\n' "$status" > "proxy-diagnostic/${name}.status.txt"
          }
          probe home 'https://magireco.moe/wiki/首页'
          probe character 'https://magireco.moe/wiki/七海八千代'
          probe category 'https://magireco.moe/wiki/Category:数据模板'
          probe template_wiki 'https://magireco.moe/wiki/Template:记忆数据表/1000円未満の魔法'
          probe template_index 'https://magireco.moe/index.php?title=Template:记忆数据表/1000円未満の魔法'

          direct_status="$(curl --silent --show-error \
            -o proxy-diagnostic/direct-template.body.html \
            -D proxy-diagnostic/direct-template.headers.txt \
            -w '%{http_code}' \
            'https://magireco.moe/wiki/Template:记忆数据表/1000円未満の魔法' || true)"
          printf '%s\n' "$direct_status" > proxy-diagnostic/direct-template.status.txt

          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('proxy-diagnostic')
          summary = {}
          for path in sorted(root.glob('*.status.txt')):
              name = path.name.removesuffix('.status.txt')
              body = root / f'{name}.body.html'
              headers = root / f'{name}.headers.txt'
              summary[name] = {
                  'status': path.read_text(encoding='utf-8').strip(),
                  'bytes': body.stat().st_size if body.exists() else 0,
                  'hasContent': 'mw-content-text' in body.read_text(encoding='utf-8', errors='replace') if body.exists() else False,
                  'headers': headers.read_text(encoding='utf-8', errors='replace')[:3000] if headers.exists() else '',
              }
          (root / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload proxy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magireco-memoria-proxy-diagnostic
          path: proxy-diagnostic
          if-no-files-found: warn
          retention-days: 7

      - name: Require at least one readable template route
        if: steps.deploy_proxy_worker.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('proxy-diagnostic/summary.json').read_text(encoding='utf-8'))
          candidates = [summary.get('template_wiki', {}), summary.get('template_index', {})]
          assert any(item.get('status') == '200' and item.get('hasContent') for item in candidates), summary
          PY

      - name: Crawl and parse representative sample
        if: steps.deploy_proxy_worker.outcome == 'success'
        run: |
          python memoria-crawl/run_resilient_memoria.py \
            --output memoria-sample \
            --limit 20 \
            --include '1000円未満の魔法' \
            --include '1000年の眠りを超えて' \
            --minimum-discovered 1 \
            --workers 4 \
            --pause 0.25 \
            --timeout 25 \
            --retries 3 \
            --max-requests 220

      - name: Validate parsed fields and Wiki-layer coverage
        if: steps.deploy_proxy_worker.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('memoria-sample')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          records = json.loads((root / 'memoria.json').read_text(encoding='utf-8'))
          failures = json.loads((root / 'failures.json').read_text(encoding='utf-8'))
          by_ja = {item['nameJa']: item for item in records}

          assert manifest['discoveredTemplatePages'] >= 1200, manifest
          assert manifest['records'] >= 19, manifest
          assert manifest['withStats'] >= 16, manifest
          assert manifest['withImage'] >= 14, manifest
          assert manifest['withChineseName'] >= 14, manifest
          assert len(failures) <= 7, failures

          for title in ('1000円未満の魔法', '1000年の眠りを超えて'):
              assert title in by_ja, (title, sorted(by_ja)[:30])
              item = by_ja[title]
              assert item['rarity'] in (1, 2, 3, 4), item
              assert item['type'], item
              assert item['effect'], item
              assert item['templateUrl'].startswith('https://magireco.moe/'), item

          under_1000 = by_ja['1000円未満の魔法']
          assert under_1000['nameZh'], under_1000
          assert under_1000['defMax'] and under_1000['defMax'] >= under_1000['defMin'], under_1000
          assert 'Accele' in under_1000['effect'] or 'A盘' in under_1000['effectDetail'], under_1000

          print(json.dumps({
              'manifest': manifest,
              'known': {key: by_ja[key] for key in ('1000円未満の魔法', '1000年の眠りを超えて')},
              'failures': failures,
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload sample evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magireco-memoria-sample
          path: memoria-sample
          if-no-files-found: warn
          retention-days: 14

      - name: Delete temporary edge proxy
        if: always()
        shell: bash
        run: |
          if [ -n "${MEMORIA_PROXY_PROJECT:-}" ]; then
            npx --yes wrangler@latest pages project delete "$MEMORIA_PROXY_PROJECT" --yes || true
          fi
