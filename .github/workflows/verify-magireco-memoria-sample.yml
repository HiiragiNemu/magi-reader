name: Verify Magireco Memoria Sample

on:
  pull_request:
    branches: [main]
    paths:
      - 'memoria-crawl/**'
      - '.github/workflows/verify-magireco-memoria-sample.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: magireco-memoria-sample
  cancel-in-progress: true

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Check out ordinary-article extractor and restricted proxy
        uses: actions/checkout@v4
        with:
          sparse-checkout: memoria-crawl
          sparse-checkout-cone-mode: true
          show-progress: false

      - name: Download verified 500-page fidelity snapshot
        uses: actions/download-artifact@v4
        with:
          name: magireco-cn-reader-500-page-parallel-snapshot
          path: snapshot
          github-token: ${{ github.token }}
          repository: HiiragiNemu/magi-reader
          run-id: 30333056699

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Prepare temporary allow-listed edge proxy
        shell: bash
        run: |
          set -euo pipefail
          project="magireco-memoria-${GITHUB_RUN_ID}"
          token="$(openssl rand -hex 24)"
          proxy="https://${project}.pages.dev"
          mkdir -p memoria-proxy-dist proxy-diagnostic
          python - <<PY
          from pathlib import Path
          source = Path('memoria-crawl/proxy-worker.js').read_text(encoding='utf-8')
          token = '${token}'
          assert '__PROXY_TOKEN__' in source
          Path('memoria-proxy-dist/_worker.js').write_text(source.replace('__PROXY_TOKEN__', token), encoding='utf-8')
          PY
          node --check memoria-proxy-dist/_worker.js
          echo "MEMORIA_PROXY_PROJECT=$project" >> "$GITHUB_ENV"
          echo "MAGIRECO_FETCH_PROXY=$proxy" >> "$GITHUB_ENV"
          echo "MAGIRECO_PROXY_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Create and deploy temporary Pages Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages project create "$MEMORIA_PROXY_PROJECT" --production-branch main \
            2>&1 | tee proxy-diagnostic/wrangler-project-create.log
          npx --yes wrangler@latest pages deploy memoria-proxy-dist \
            --project-name "$MEMORIA_PROXY_PROJECT" \
            --branch main \
            --commit-dirty=true \
            2>&1 | tee proxy-diagnostic/wrangler-pages-deploy.log
          for attempt in $(seq 1 40); do
            status="$(curl --silent --show-error -o proxy-diagnostic/health.json -w '%{http_code}' "$MAGIRECO_FETCH_PROXY/health" || true)"
            if [ "$status" = 200 ] && grep -q 'ordinary-memoria-articles-only' proxy-diagnostic/health.json; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Verify one ordinary Memoria article through proxy
        shell: bash
        run: |
          set -euo pipefail
          target='https://magireco.moe/wiki/记忆结晶/1000円未満の魔法'
          encoded="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$target")"
          status="$(curl --silent --show-error \
            -D proxy-diagnostic/article.headers.txt \
            -o proxy-diagnostic/article.body.html \
            -w '%{http_code}' \
            -H "x-magireco-proxy-token: $MAGIRECO_PROXY_TOKEN" \
            "$MAGIRECO_FETCH_PROXY/?url=$encoded")"
          printf '%s\n' "$status" > proxy-diagnostic/article.status.txt
          test "$status" = 200
          grep -q 'mw-content-text' proxy-diagnostic/article.body.html
          grep -q '1000' proxy-diagnostic/article.body.html
          grep -q 'HP' proxy-diagnostic/article.body.html
          grep -q 'ATK' proxy-diagnostic/article.body.html
          grep -q 'DEF' proxy-diagnostic/article.body.html

      - name: Parse representative ordinary-article sample
        run: |
          python memoria-crawl/build_memoria_from_snapshot.py \
            --snapshot snapshot \
            --output memoria-sample \
            --limit 20 \
            --include '1000円未満の魔法' \
            --include '1000年の眠りを超えて' \
            --workers 3 \
            --pause 0.45 \
            --timeout 25 \
            --retries 4 \
            --max-requests 180

      - name: Validate snapshot membership and parsed fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('memoria-sample')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          records = json.loads((root / 'memoria.json').read_text(encoding='utf-8'))
          failures = json.loads((root / 'failures.json').read_text(encoding='utf-8'))
          by_ja = {item['nameJa']: item for item in records}

          assert manifest['source'] == 'verified-snapshot-membership-and-ordinary-article-pages', manifest
          assert manifest['snapshotArticleMembers'] >= 1040, manifest
          assert manifest['records'] >= 20, manifest
          assert manifest['withStats'] >= 16, manifest
          assert manifest['withImage'] == manifest['records'], manifest
          assert manifest['withChineseName'] >= 16, manifest
          assert len(failures) <= 4, failures

          for title in ('1000円未満の魔法', '1000年の眠りを超えて'):
              assert title in by_ja, (title, sorted(by_ja)[:30])
              item = by_ja[title]
              assert item['articleTitle'].startswith('记忆结晶/'), item
              assert item['articleUrl'].startswith('https://magireco.moe/'), item
              assert item['rarity'] in (1, 2, 3, 4), item
              assert item['type'], item
              assert item['effect'], item
              assert item['hpMin'] is not None and item['hpMax'] is not None, item

          under_1000 = by_ja['1000円未満の魔法']
          assert under_1000['nameZh'], under_1000
          assert under_1000['defMax'] and under_1000['defMax'] >= under_1000['defMin'], under_1000
          assert 'Accele' in under_1000['effect'] or 'A盘' in under_1000['effectDetail'], under_1000

          print(json.dumps({'manifest': manifest, 'known': {
              key: by_ja[key] for key in ('1000円未満の魔法', '1000年の眠りを超えて')
          }, 'failures': failures}, ensure_ascii=False, indent=2))
          PY

      - name: Upload sample and proxy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magireco-memoria-ordinary-article-sample
          path: |
            memoria-sample
            proxy-diagnostic
          if-no-files-found: warn
          retention-days: 14

      - name: Delete temporary edge proxy
        if: always()
        shell: bash
        run: |
          if [ -n "${MEMORIA_PROXY_PROJECT:-}" ]; then
            npx --yes wrangler@latest pages project delete "$MEMORIA_PROXY_PROJECT" --yes || true
          fi
