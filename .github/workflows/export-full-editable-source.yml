name: Export Full Editable Source

on:
  pull_request:
    branches:
      - tooling/full-source-export-base

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.event.pull_request.head.ref == 'tooling/full-source-export-run' &&
      github.event.pull_request.base.ref == 'tooling/full-source-export-base'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch current feature branch quietly
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet .
          git remote add origin https://github.com/${{ github.repository }}.git
          git -c protocol.version=2 fetch --quiet --depth=1 origin feature/exedra-cn-and-magireco-voice
          git checkout --quiet FETCH_HEAD

      - name: Package source excluding localization data and build products
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          tar -czf "$RUNNER_TEMP/export/full-editable-source.tar.gz" \
            --exclude='.git' \
            --exclude='website/node_modules' \
            --exclude='website/.next' \
            --exclude='website/.open-next' \
            --exclude='website/public/data' \
            --exclude='website/public/search_content.json' \
            --exclude='magireco-source-master' \
            --exclude='magireco-translate-data-master' \
            --exclude='magiraexedra-source-master' \
            --exclude='magiraexedra-translate-data-master' \
            .
          sha256sum "$RUNNER_TEMP/export/full-editable-source.tar.gz" \
            > "$RUNNER_TEMP/export/full-editable-source.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: full-editable-source
          path: ${{ runner.temp }}/export/
          if-no-files-found: error
          retention-days: 1
