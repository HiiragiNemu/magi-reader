name: Robust manual retranslation apply

on:
  push:
    branches:
      - reader/manual-gpt-retranslation-20260816
    paths:
      - manual_retranslation/exact_parts/**/READY
      - manual_retranslation/reapply_trigger.txt
      - .github/workflows/manual-retranslation-robust-apply.yml

permissions:
  contents: write

concurrency:
  group: robust-manual-retranslation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify exact bundles
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/exact-bundles"
          mkdir -p "$RUNNER_TEMP/exact-bundles"
          find manual_retranslation/exact_bundles -maxdepth 1 -type f -name '*.json.gz.b64' -exec cp {} "$RUNNER_TEMP/exact-bundles/" \; 2>/dev/null || true
          while IFS= read -r ready; do
            dir="$(dirname "$ready")"
            out="$(tr -d '\r\n' < "$ready")"
            test -n "$out"
            find "$dir" -maxdepth 1 -type f -name '*.part' -print0 | sort -z | xargs -0 cat > "$RUNNER_TEMP/exact-bundles/$out"
            expected="$(awk 'NF {print $1; exit}' "$dir/SHA256")"
            actual="$(sha256sum "$RUNNER_TEMP/exact-bundles/$out" | awk '{print $1}')"
            test "$actual" = "$expected"
          done < <(find manual_retranslation/exact_parts -mindepth 2 -maxdepth 2 -type f -name READY | sort)
          test "$(find "$RUNNER_TEMP/exact-bundles" -type f -name '*.json.gz.b64' | wc -l)" -gt 0

      - name: Preserve pre-apply tree
        shell: bash
        run: |
          set -euo pipefail
          cp -a magireco-translate-data-master/Scenarios_full "$RUNNER_TEMP/Scenarios_full.before"

      - name: Apply exact reviewed translations
        shell: bash
        run: |
          set -euo pipefail
          python manual_retranslation/apply_exact_batches.py \
            --bundle-dir "$RUNNER_TEMP/exact-bundles" \
            --target-root magireco-translate-data-master/Scenarios_full

      - name: Validate JSON structure and functional invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          before = Path('${{ runner.temp }}/Scenarios_full.before')
          after = Path('magireco-translate-data-master/Scenarios_full')
          allowed = {
              'textLeft', 'textRight', 'textCenter', 'narration',
              'progressNarration', 'textSelect', 'nameLeft', 'nameRight',
              'nameCenter', 'nameNarration',
          }
          tag_re = re.compile(r'\[[^\]\r\n]+\]')
          before_files = {p.relative_to(before) for p in before.rglob('*.json')}
          after_files = {p.relative_to(after) for p in after.rglob('*.json')}
          if before_files != after_files:
              raise SystemExit('JSON file set changed')

          changed_files = 0
          changed_fields = 0

          def walk(a, b, path=()):
              global changed_fields
              if type(a) is not type(b):
                  raise AssertionError(f'type changed at {path}')
              if isinstance(a, dict):
                  if a.keys() != b.keys():
                      raise AssertionError(f'dict keys changed at {path}')
                  for key in a:
                      walk(a[key], b[key], path + (key,))
                  return
              if isinstance(a, list):
                  if len(a) != len(b):
                      raise AssertionError(f'list length changed at {path}')
                  for index, (x, y) in enumerate(zip(a, b)):
                      walk(x, y, path + (index,))
                  return
              if a == b:
                  return
              if not path or path[-1] not in allowed:
                  raise AssertionError(f'non-text value changed at {path}')
              if not isinstance(a, str) or not isinstance(b, str):
                  raise AssertionError(f'non-string text value changed at {path}')
              if a.count('@') != b.count('@'):
                  raise AssertionError(f'@ count changed at {path}')
              if tag_re.findall(a) != tag_re.findall(b):
                  raise AssertionError(f'control-tag sequence changed at {path}')
              changed_fields += 1

          for rel in sorted(before_files, key=str):
              bp = before / rel
              ap = after / rel
              if bp.read_bytes() == ap.read_bytes():
                  continue
              changed_files += 1
              with bp.open(encoding='utf-8-sig') as f:
                  old = json.load(f)
              with ap.open(encoding='utf-8-sig') as f:
                  new = json.load(f)
              walk(old, new, (str(rel),))

          print(json.dumps({'changed_files': changed_files, 'changed_fields': changed_fields}, ensure_ascii=False))
          PY

      - name: Commit and push translated JSON
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'magi-reader translation bot'
          git config user.email 'actions@users.noreply.github.com'
          git add magireco-translate-data-master/Scenarios_full
          if git diff --cached --quiet; then
            echo 'No new scenario changes; all exact bundles are already applied.'
            exit 0
          fi
          git commit -m 'Apply validated manual retranslation batches'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
