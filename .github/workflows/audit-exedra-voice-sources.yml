name: Audit Exedra And Voice Sources

on:
  pull_request:
    branches: [feature/exedra-cn-and-magireco-voice]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Audit source repositories and current manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/audit_exedra_voice_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: exedra-voice-source-audit
          path: artifacts/exedra_voice_source_audit.json
