name: Deploy Magireco Structured Reader v5

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki-preservation/static/**'
      - 'wiki-preservation/scripts/reclassify_portals.py'
      - 'wiki-preservation/scripts/extract_structured_characters.py'
      - 'wiki-preservation/scripts/extract_structured_doppel.py'
      - 'wiki-preservation/scripts/patch_structured_runtime.py'
      - 'wiki-preservation/scripts/patch_offline_runtime.py'
      - '.github/workflows/deploy-magireco-ui-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: magireco-cn-reader-structured-v5
  cancel-in-progress: true

jobs:
  deploy-structured-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Check out structured UI and extractors
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            wiki-preservation/static
            wiki-preservation/scripts/reclassify_portals.py
            wiki-preservation/scripts/extract_structured_characters.py
            wiki-preservation/scripts/extract_structured_doppel.py
            wiki-preservation/scripts/patch_structured_runtime.py
            wiki-preservation/scripts/patch_offline_runtime.py
          sparse-checkout-cone-mode: true
          show-progress: false

      - name: Download verified 500-page fidelity snapshot
        uses: actions/download-artifact@v4
        with:
          name: magireco-cn-reader-500-page-parallel-snapshot
          path: snapshot
          github-token: ${{ github.token }}
          repository: HiiragiNemu/magi-reader
          run-id: 30333056699

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install structured extraction dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml

      - name: Replace application shell and build structured datasets
        shell: bash
        run: |
          set -euo pipefail
          cp wiki-preservation/static/index.html snapshot/index.html
          cp wiki-preservation/static/app.js snapshot/app.js
          cp wiki-preservation/static/styles.css snapshot/styles.css
          cp wiki-preservation/static/ui-v4-fixes.css snapshot/ui-v4-fixes.css
          cp wiki-preservation/static/ui-v4-runtime.js snapshot/ui-v4-runtime.js
          cp wiki-preservation/static/structured-ui.js snapshot/structured-ui.js
          cp wiki-preservation/static/structured-ui.css snapshot/structured-ui.css
          cp wiki-preservation/static/doppel-ui.js snapshot/doppel-ui.js
          cp wiki-preservation/static/doppel-ui.css snapshot/doppel-ui.css
          cp wiki-preservation/static/sw.js snapshot/sw.js

          python wiki-preservation/scripts/patch_structured_runtime.py snapshot/structured-ui.js
          python wiki-preservation/scripts/reclassify_portals.py snapshot
          python wiki-preservation/scripts/extract_structured_characters.py snapshot
          python wiki-preservation/scripts/extract_structured_doppel.py snapshot

          python - <<'PY'
          import json
          from pathlib import Path

          revision = '5.4'
          index_path = Path('snapshot/index.html')
          index = index_path.read_text(encoding='utf-8')
          replacements = {
              'styles.css?v=5.0': f'styles.css?v={revision}',
              'ui-v4-fixes.css?v=5.0': f'ui-v4-fixes.css?v={revision}',
              'structured-ui.css?v=5.0': f'structured-ui.css?v={revision}',
              'doppel-ui.css?v=5.3': f'doppel-ui.css?v={revision}',
              'ui-v4-runtime.js?v=5.0': f'ui-v4-runtime.js?v={revision}',
              'app.js?v=5.0': f'app.js?v={revision}',
              'structured-ui.js?v=5.0&rev=5.2': f'structured-ui.js?v={revision}',
              'structured-ui.js?v=5.0': f'structured-ui.js?v={revision}',
              'doppel-ui.js?v=5.3': f'doppel-ui.js?v={revision}',
          }
          for old, new in replacements.items():
              index = index.replace(old, new)
          required = [
              f'/styles.css?v={revision}',
              f'/ui-v4-fixes.css?v={revision}',
              f'/structured-ui.css?v={revision}',
              f'/doppel-ui.css?v={revision}',
              f'/ui-v4-runtime.js?v={revision}',
              f'/app.js?v={revision}',
              f'/structured-ui.js?v={revision}',
              f'/doppel-ui.js?v={revision}',
          ]
          missing = [value for value in required if value not in index]
          assert not missing, (missing, index)
          index_path.write_text(index, encoding='utf-8')

          health_path = Path('snapshot/health.json')
          health = json.loads(health_path.read_text(encoding='utf-8-sig'))
          structured = json.loads(Path('snapshot/data/structured/manifest.json').read_text(encoding='utf-8'))
          health['uiVersion'] = 5
          health['uiRevision'] = revision
          health['portalClassification'] = 'wiki-articles-only'
          health['structured'] = structured
          health['uiFeatures'] = [
              'structured-character-catalog',
              'structured-character-profiles',
              'native-audio-voice-player',
              'voice-costume-and-group-filters',
              'structured-doppel-catalog',
              'bilingual-doppel-profiles',
              'idempotent-legacy-navigation-bridge',
              'route-timer-isolation',
              'versioned-offline-shell',
              'legacy-cache-eviction',
              'wiki-article-preservation-layer',
              'responsive-wiki-html',
              'table-scroll-containers',
              'image-lightbox',
              'system-light-dark-eye-oled-themes',
              'font-and-content-width-controls',
          ]
          health_path.write_text(json.dumps(health, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('snapshot/ui-version.json').write_text(json.dumps({
              'uiVersion': 5,
              'uiRevision': revision,
              'name': 'structured-character-voice-doppel-offline-reader',
              'structured': structured,
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python wiki-preservation/scripts/patch_offline_runtime.py snapshot --revision 5.4

      - name: Validate characters voices Doppel and offline runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check snapshot/app.js
          node --check snapshot/ui-v4-runtime.js
          node --check snapshot/structured-ui.js
          node --check snapshot/doppel-ui.js
          node --check snapshot/sw.js

          grep -q 'styles.css?v=5.4' snapshot/index.html
          grep -q 'ui-v4-fixes.css?v=5.4' snapshot/index.html
          grep -q 'structured-ui.css?v=5.4' snapshot/index.html
          grep -q 'doppel-ui.css?v=5.4' snapshot/index.html
          grep -q 'app.js?v=5.4' snapshot/index.html
          grep -q 'structured-ui.js?v=5.4' snapshot/index.html
          grep -q 'doppel-ui.js?v=5.4' snapshot/index.html
          grep -q "const UI_VERSION = '5.4'" snapshot/app.js
          grep -q 'magireco-cn-reader-v5.4-offline' snapshot/sw.js
          grep -q '/structured-ui.js?v=5.4' snapshot/sw.js
          grep -q '/doppel-ui.js?v=5.4' snapshot/sw.js
          grep -q '/data/structured/doppel.json' snapshot/sw.js
          ! grep -q 'magireco-cn-reader-v4-ui' snapshot/sw.js

          grep -q '5.2-route-timer-isolation' snapshot/structured-ui.js
          grep -q 'clearTimeout(window.__structuredCharacterTimer)' snapshot/structured-ui.js
          grep -q 'CHARACTER VOICE ARCHIVE' snapshot/structured-ui.js
          grep -q 'audio controls preload="none"' snapshot/structured-ui.js
          grep -q 'STRUCTURED DOPPEL ARCHIVE' snapshot/doppel-ui.js

          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('snapshot')
          health = json.loads((root / 'health.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'data/structured/manifest.json').read_text(encoding='utf-8'))
          characters = json.loads((root / 'data/structured/characters.json').read_text(encoding='utf-8'))
          voices = json.loads((root / 'data/structured/voice-index.json').read_text(encoding='utf-8'))
          doppels = json.loads((root / 'data/structured/doppel.json').read_text(encoding='utf-8'))
          by_title = {item['title']: item for item in characters}
          by_character = {item['character']: item for item in doppels}

          assert health['counts']['pages'] == 500, health
          assert health['counts']['images'] >= 12000, health
          assert health['uiVersion'] == 5 and health['uiRevision'] == '5.4', health
          assert {'versioned-offline-shell', 'legacy-cache-eviction'} <= set(health['uiFeatures'])
          assert manifest['characters'] >= 235, manifest
          assert manifest['characterPages'] >= 225, manifest
          assert manifest['organizations'] >= 6, manifest
          assert manifest['voiceCharacters'] >= 220, manifest
          assert manifest['voiceLines'] >= 16000, manifest
          assert manifest['voiceWithAudio'] >= 16000, manifest
          assert manifest['doppel'] == 174, manifest
          assert manifest['doppelWithImage'] >= 170, manifest
          assert len(doppels) == 174 and len(voices) == manifest['voiceCharacters']
          assert {'七海八千代', '环伊吕波', '三穗野星罗', '千岁由麻'} <= set(by_title)
          assert {'七海八千代', '环伊吕波', '千岁由麻'} <= set(by_character)
          assert 'Ablaze' not in by_title
          yachiyo = by_title['七海八千代']
          assert yachiyo['voiceCount'] >= 70, yachiyo
          lines = json.loads((root / 'data/structured/voice' / f"{yachiyo['voiceKey']}.json").read_text(encoding='utf-8'))
          assert any(item.get('voiceId') == 'Vo_char_1002_00_01' for item in lines)
          assert any(str(item.get('audioUrl', '')).endswith('.mp3') for item in lines)
          yuma = by_character['千岁由麻']
          assert yuma['name'] and yuma['descriptionZh'] and yuma['doppelImageUrl']
          print(json.dumps({'health': health, 'structured': manifest, 'yumaDoppel': yuma}, ensure_ascii=False, indent=2))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy structured reader v5.4
        run: |
          npx --yes wrangler@latest pages deploy snapshot \
            --project-name magireco-cn-reader \
            --branch main \
            --commit-dirty=true

      - name: Verify uncached production datasets and offline shell
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          for attempt in $(seq 1 50); do
            for file in health.json index.html app.js sw.js structured-ui.js doppel-ui.js data/structured/manifest.json data/structured/characters.json data/structured/voice-index.json data/structured/doppel.json; do
              safe=$(printf '%s' "$file" | tr '/.' '__')
              curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' \
                "https://magireco-cn-reader.pages.dev/$file?v=$nonce-$attempt" -o "/tmp/$safe" || true
            done
            if python - <<'PY'
          import json
          from pathlib import Path
          try:
              health = json.loads(Path('/tmp/health_json').read_text(encoding='utf-8-sig'))
              index = Path('/tmp/index_html').read_text(encoding='utf-8')
              app = Path('/tmp/app_js').read_text(encoding='utf-8')
              sw = Path('/tmp/sw_js').read_text(encoding='utf-8')
              structured_ui = Path('/tmp/structured-ui_js').read_text(encoding='utf-8')
              doppel_ui = Path('/tmp/doppel-ui_js').read_text(encoding='utf-8')
              manifest = json.loads(Path('/tmp/data_structured_manifest_json').read_text(encoding='utf-8-sig'))
              characters = json.loads(Path('/tmp/data_structured_characters_json').read_text(encoding='utf-8-sig'))
              voice_index = json.loads(Path('/tmp/data_structured_voice-index_json').read_text(encoding='utf-8-sig'))
              doppels = json.loads(Path('/tmp/data_structured_doppel_json').read_text(encoding='utf-8-sig'))
              titles = {item['title'] for item in characters}
              doppel_characters = {item['character'] for item in doppels}

              assert health['status'] == 'ok'
              assert health['uiVersion'] == 5 and health['uiRevision'] == '5.4'
              assert health['counts']['pages'] == 500
              assert manifest['characters'] >= 235 and manifest['voiceWithAudio'] >= 16000
              assert manifest['doppel'] == 174 and len(doppels) == 174 and len(voice_index) >= 220
              assert {'七海八千代', '环伊吕波'} <= titles
              assert {'千岁由麻', '环伊吕波'} <= doppel_characters
              assert 'Ablaze' not in titles
              for asset in ('styles.css', 'app.js', 'structured-ui.js', 'doppel-ui.js'):
                  assert f'/{asset}?v=5.4' in index, (asset, index)
              assert "const UI_VERSION = '5.4'" in app
              assert 'magireco-cn-reader-v5.4-offline' in sw
              assert '/structured-ui.js?v=5.4' in sw and '/doppel-ui.js?v=5.4' in sw
              assert '/data/structured/doppel.json' in sw
              assert 'magireco-cn-reader-v4-ui' not in sw
              assert '5.2-route-timer-isolation' in structured_ui
              assert 'STRUCTURED DOPPEL ARCHIVE' in doppel_ui
              print('PRODUCTION_STRUCTURED_V5_4_OFFLINE_OK', manifest)
          except Exception as exc:
              print('not ready:', exc)
              raise SystemExit(1)
          PY
            then
              exit 0
            fi
            sleep 6
          done
          exit 1
