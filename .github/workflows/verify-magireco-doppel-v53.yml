name: Verify Magireco Doppel v5.3

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-doppel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Doppel production test
        uses: actions/checkout@v4
        with:
          sparse-checkout: tests/verify-magireco-doppel-v53.mjs
          sparse-checkout-cone-mode: true
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run Doppel catalog production test
        run: node tests/verify-magireco-doppel-v53.mjs

      - name: Upload Doppel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magireco-doppel-v53-mobile-evidence
          path: doppel-v53-evidence
          if-no-files-found: warn
          retention-days: 14
