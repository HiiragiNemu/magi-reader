name: Test Legacy Magireco Reader UI v4

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magireco-cn-reader-legacy-ui-browser-test
  cancel-in-progress: true

jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out legacy browser test only
        uses: actions/checkout@v4
        with:
          sparse-checkout: wiki-preservation/tests
          sparse-checkout-cone-mode: true
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Prepare UI v4.3 production test
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('wiki-preservation/tests/production-ui-v4.mjs')
          target = Path('wiki-preservation/tests/production-ui-v4-run.mjs')
          target.write_text(source.read_text(encoding='utf-8').replace('4.2', '4.3'), encoding='utf-8')
          PY

      - name: Run legacy production mobile interaction test
        run: node wiki-preservation/tests/production-ui-v4-run.mjs

      - name: Upload legacy screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magireco-reader-ui-v4-mobile-evidence
          path: ui-test-output
          if-no-files-found: warn
          retention-days: 14
