name: Deploy Exedra Community Proofreading Test Site

on:
  push:
    branches: [EXEDRA-TEST]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-exedra-community-proofreading-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_WORKER_NAME: magireader-exedra-cn-test
      PROOFREADING_KV_TITLE: magi-submissions-exedra-cn-test
      TEST_WORKER_HOSTNAME: magireader-exedra-cn-test.crynetsystemscell.workers.dev
      SERVER_GITHUB_TOKEN: ${{ secrets.PROOFREADING_GITHUB_TOKEN }}
      SHARED_ADMIN_TOKEN: ${{ secrets.SUBMISSIONS_ADMIN_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Generate complete deployable story data and machine baseline
        shell: bash
        run: |
          set -euo pipefail
          python generate_story_index.py
          python generate_machine_translation_manifest.py \
            --translation-base 65f221f2aaa5a9fe161ed32e03e4dfbb93d4746d \
            --translation-commit 3d463befe7a10d4cb72034378ce2a6f23c377abb
          total="$(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('website/public/data/machine_translation_manifest.generated.json').read_text(encoding='utf-8'))
          print(manifest.get('total', 0))
          PY
          )"
          if [ "$total" -le 15 ]; then
            echo "Generated machine translation baseline is incomplete: $total" >&2
            exit 1
          fi
          echo "EXPECTED_MACHINE_TOTAL=$total" >> "$GITHUB_ENV"
          echo "MACHINE_BASELINE_OK total=$total"

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Lint, type check and website tests
        working-directory: website
        run: |
          npm run lint
          npm run type-check
          npm test

      - name: Generate matching search manifest
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/search_content.json"
          python build_search_index_v6.py --output "$payload"
          python build_search_index_v6.py --output "$payload" --validate-only
          echo "Full-text payload is validated but intentionally not uploaded without R2 permission."

      - name: Build Cloudflare Worker output
        working-directory: website
        run: npm run build:worker

      - name: Discover or create dedicated proofreading KV
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: >-
          python scripts/proofreading_queue.py namespace
          --title "$PROOFREADING_KV_TITLE"
          --create

      - name: Resolve Turnstile credentials
        id: turnstile
        env:
          REAL_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          REAL_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$REAL_SITE_KEY" ] && [ -n "$REAL_SECRET_KEY" ]; then
            site_key="$REAL_SITE_KEY"
            secret_key="$REAL_SECRET_KEY"
            test_mode=false
          else
            site_key='1x00000000000000000000AA'
            secret_key='1x0000000000000000000000000000000AA'
            test_mode=true
            echo "::warning::Using Cloudflare Turnstile test keys. Configure TURNSTILE_SITE_KEY and TURNSTILE_SECRET_KEY before public launch."
          fi
          echo "site_key=$site_key" >> "$GITHUB_OUTPUT"
          echo "test_mode=$test_mode" >> "$GITHUB_OUTPUT"
          echo "TURNSTILE_SECRET_KEY_VALUE=$secret_key" >> "$GITHUB_ENV"
          echo "::add-mask::$secret_key"

      - name: Prepare isolated Worker configurations
        working-directory: website
        env:
          KV_NAMESPACE_ID: ${{ steps.kv.outputs.namespace_id }}
          TURNSTILE_SITE_KEY: ${{ steps.turnstile.outputs.site_key }}
          TURNSTILE_TEST_MODE: ${{ steps.turnstile.outputs.test_mode }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat > .wrangler-proofreading-bootstrap.jsonc <<EOF
          {
            "name": "$TEST_WORKER_NAME",
            "main": ".wrangler-proofreading-bootstrap.mjs",
            "compatibility_date": "2026-02-14",
            "workers_dev": true
          }
          EOF
          cat > .wrangler-proofreading-bootstrap.mjs <<'EOF'
          export default { fetch() { return new Response('Preparing proofreading deployment.'); } };
          EOF
          cat > .wrangler-proofreading-test.jsonc <<EOF
          {
            "\$schema": "node_modules/wrangler/config-schema.json",
            "name": "$TEST_WORKER_NAME",
            "main": ".open-next/worker.js",
            "compatibility_date": "2026-02-14",
            "compatibility_flags": ["nodejs_compat", "global_fetch_strictly_public"],
            "workers_dev": true,
            "assets": { "directory": ".open-next/assets", "binding": "ASSETS" },
            "services": [
              { "binding": "WORKER_SELF_REFERENCE", "service": "$TEST_WORKER_NAME" }
            ],
            "kv_namespaces": [
              { "binding": "SUBMISSIONS_KV", "id": "$KV_NAMESPACE_ID" }
            ],
            "vars": {
              "TURNSTILE_SITE_KEY": "$TURNSTILE_SITE_KEY",
              "TURNSTILE_ALLOWED_HOSTNAMES": "$TEST_WORKER_HOSTNAME",
              "PROOFREADING_TARGET_BRANCH": "EXEDRA-TEST",
              "PROOFREADING_SOURCE_COMMIT": "$SOURCE_COMMIT",
              "PROOFREADING_GITHUB_REPO": "${{ github.repository }}",
              "PROOFREADING_ALLOW_GITHUB_ADMIN": "true",
              "PROOFREADING_TURNSTILE_TEST_MODE": "$TURNSTILE_TEST_MODE"
            }
          }
          EOF

      - name: Create isolated Worker service shell
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --config .wrangler-proofreading-bootstrap.jsonc

      - name: Configure Turnstile Worker secret
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TURNSTILE_SECRET: ${{ env.TURNSTILE_SECRET_KEY_VALUE }}
        shell: bash
        run: printf '%s' "$TURNSTILE_SECRET" | npx wrangler secret put TURNSTILE_SECRET_KEY --config .wrangler-proofreading-test.jsonc

      - name: Configure optional server-side GitHub token
        if: env.SERVER_GITHUB_TOKEN != ''
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROOFREADING_GITHUB_TOKEN: ${{ env.SERVER_GITHUB_TOKEN }}
        shell: bash
        run: printf '%s' "$PROOFREADING_GITHUB_TOKEN" | npx wrangler secret put PROOFREADING_GITHUB_TOKEN --config .wrangler-proofreading-test.jsonc

      - name: Configure optional shared admin token
        if: env.SHARED_ADMIN_TOKEN != ''
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SUBMISSIONS_ADMIN_TOKEN: ${{ env.SHARED_ADMIN_TOKEN }}
        shell: bash
        run: printf '%s' "$SUBMISSIONS_ADMIN_TOKEN" | npx wrangler secret put SUBMISSIONS_ADMIN_TOKEN --config .wrangler-proofreading-test.jsonc

      - name: Deploy complete proofreading site
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy --config .wrangler-proofreading-test.jsonc

      - name: Smoke-test public site and dynamic proofreading state
        env:
          SITE_URL: https://${{ env.TEST_WORKER_HOSTNAME }}
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 30); do
            home_code="$(curl -L --silent --show-error -o "$RUNNER_TEMP/home.html" -w '%{http_code}' "$SITE_URL/")"
            machine_code="$(curl -L --silent --show-error -o "$RUNNER_TEMP/machine-status.json" -w '%{http_code}' "$SITE_URL/api/proofreading/machine-status")"
            if [ "$home_code" = 200 ] && [ "$machine_code" = 200 ]; then
              live_total="$(python3 - "$RUNNER_TEMP/machine-status.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          value = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(value.get('total', 0))
          PY
              )"
              if [ "$live_total" = "$EXPECTED_MACHINE_TOTAL" ]; then
                ready=true
                break
              fi
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            echo "Deployed Worker did not expose the expected machine baseline in time." >&2
            exit 1
          fi
          curl --fail --silent --show-error "$SITE_URL/story_index.json" -o "$RUNNER_TEMP/story-index.json"
          curl --fail --silent --show-error "$SITE_URL/api/proofreading/config" -o "$RUNNER_TEMP/config.json"
          curl --fail --silent --show-error "$SITE_URL/review/submissions" -o "$RUNNER_TEMP/submissions.html"
          curl --fail --silent --show-error "$SITE_URL/review/machine-translations" -o "$RUNNER_TEMP/machine-review.html"
          admin_code="$(curl --silent --show-error -o "$RUNNER_TEMP/admin.json" -w '%{http_code}' "$SITE_URL/api/admin/machine-review")"
          python3 - "$RUNNER_TEMP/home.html" "$RUNNER_TEMP/story-index.json" "$RUNNER_TEMP/config.json" "$RUNNER_TEMP/machine-status.json" "$RUNNER_TEMP/submissions.html" "$RUNNER_TEMP/machine-review.html" "$admin_code" "$EXPECTED_MACHINE_TOTAL" <<'PY'
          import json, sys
          from pathlib import Path
          home = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          stories = json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          config = json.loads(Path(sys.argv[3]).read_text(encoding='utf-8'))
          machine = json.loads(Path(sys.argv[4]).read_text(encoding='utf-8'))
          submissions = Path(sys.argv[5]).read_text(encoding='utf-8', errors='replace')
          machine_review = Path(sys.argv[6]).read_text(encoding='utf-8', errors='replace')
          admin_code = sys.argv[7]
          expected_total = int(sys.argv[8])
          if min(map(len, (home, submissions, machine_review))) < 500:
              raise SystemExit('Deployed site content is incomplete')
          if not isinstance(stories, list) or not stories:
              raise SystemExit('Deployed story index is incomplete')
          if not config.get('submissions_enabled') or not config.get('turnstile_site_key'):
              raise SystemExit(f'Proofreading service is not enabled: {config}')
          if config.get('target_branch') != 'EXEDRA-TEST':
              raise SystemExit(f'Unexpected target branch: {config}')
          if machine.get('total') != expected_total:
              raise SystemExit(f'Unexpected machine translation total: {machine}')
          if machine.get('remaining') != machine.get('total') - machine.get('verified', 0):
              raise SystemExit(f'Invalid machine translation status: {machine}')
          if len(machine.get('machine_translation_ids', [])) != expected_total:
              raise SystemExit('Incomplete machine translation id list')
          if 'states' in machine:
              raise SystemExit('Public machine status leaked private review metadata')
          if admin_code not in {'401', '503'}:
              raise SystemExit(f'Unauthenticated admin API returned {admin_code}')
          print(
              f"SITE_OK stories={len(stories)} machine_total={machine['total']} "
              f"verified={machine['verified']} remaining={machine['remaining']} "
              f"turnstile_test_mode={config.get('turnstile_test_mode')} "
              f"admin_unauthenticated={admin_code}"
          )
          PY
