name: Deploy EXEDRA-TEST TW Simplified Site

on:
  push:
    branches: [EXEDRA-TEST]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-exedra-community-proofreading-test
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, '[tw-materialized]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_WORKER_NAME: magireader-exedra-cn-test
      PROOFREADING_KV_TITLE: magi-submissions-exedra-cn-test
      TEST_WORKER_HOSTNAME: magireader-exedra-cn-test.crynetsystemscell.workers.dev
      MAGIRECO_VOICE_R2_DOMAIN: pub-70a248f1a6fe4ca597e7a10f8b95dfd8.r2.dev
      SERVER_GITHUB_TOKEN: ${{ secrets.PROOFREADING_GITHUB_TOKEN || secrets.TARGET_REPO_TOKEN }}
      SHARED_ADMIN_TOKEN: ${{ secrets.SUBMISSIONS_ADMIN_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Rebuild committed data and materialize same-origin search chunks
        shell: bash
        run: |
          set -euo pipefail
          cp website/public/story_index.json "$RUNNER_TEMP/story_index.committed.json"
          for scope in magireco exedra; do
            cp "website/public/search_index_manifest.$scope.json" \
              "$RUNNER_TEMP/search_index_manifest.$scope.committed.json"
          done

          python generate_story_index.py
          python tools/apply_tw_official_metadata.py
          python generate_machine_translation_manifest.py \
            --translation-base 65f221f2aaa5a9fe161ed32e03e4dfbb93d4746d \
            --translation-commit 3d463befe7a10d4cb72034378ce2a6f23c377abb
          python tools/build_split_search_indexes.py
          python tools/build_split_search_indexes.py --validate-only

          cmp "$RUNNER_TEMP/story_index.committed.json" website/public/story_index.json
          for scope in magireco exedra; do
            cmp \
              "$RUNNER_TEMP/search_index_manifest.$scope.committed.json" \
              "website/public/search_index_manifest.$scope.json"
          done

          python tools/search_chunk_delivery.py materialize
          python tools/search_chunk_delivery.py verify-tree --root website/public

      - name: Run complete checks
        working-directory: website
        run: npm run check

      - name: Build Cloudflare Worker output
        working-directory: website
        run: npm run build:worker

      - name: Verify Cloudflare output and physical search chunks
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix website run verify:cloudflare-output
          python tools/search_chunk_delivery.py verify-tree --root website/.open-next/assets

      - name: Discover or create dedicated proofreading KV
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: >-
          python scripts/proofreading_queue.py namespace
          --title "$PROOFREADING_KV_TITLE"
          --create

      - name: Resolve Turnstile credentials
        id: turnstile
        env:
          REAL_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          REAL_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$REAL_SITE_KEY" ] && [ -n "$REAL_SECRET_KEY" ]; then
            site_key="$REAL_SITE_KEY"
            secret_key="$REAL_SECRET_KEY"
            test_mode=false
          else
            site_key='1x00000000000000000000AA'
            secret_key='1x0000000000000000000000000000000AA'
            test_mode=true
            echo "::warning::Using Cloudflare Turnstile test keys."
          fi
          echo "site_key=$site_key" >> "$GITHUB_OUTPUT"
          echo "test_mode=$test_mode" >> "$GITHUB_OUTPUT"
          echo "TURNSTILE_SECRET_KEY_VALUE=$secret_key" >> "$GITHUB_ENV"
          echo "::add-mask::$secret_key"

      - name: Discover optional Magia Record voice R2 bucket
        id: voice_r2
        timeout-minutes: 3
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: >-
          node scripts/discover-cloudflare-r2-bucket.mjs
          --target-domain "$MAGIRECO_VOICE_R2_DOMAIN"

      - name: Prepare isolated Worker configurations
        working-directory: website
        env:
          KV_NAMESPACE_ID: ${{ steps.kv.outputs.namespace_id }}
          VOICE_R2_BUCKET_NAME: ${{ steps.voice_r2.outputs.bucket_name }}
          TURNSTILE_SITE_KEY: ${{ steps.turnstile.outputs.site_key }}
          TURNSTILE_TEST_MODE: ${{ steps.turnstile.outputs.test_mode }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          voice_r2_config=""
          if [ -n "$VOICE_R2_BUCKET_NAME" ]; then
            voice_r2_config="$(cat <<EOF
            "r2_buckets": [
              {
                "binding": "MAGIRECO_VOICE_R2",
                "bucket_name": "$VOICE_R2_BUCKET_NAME"
              }
            ],
          EOF
            )"
          else
            echo "::warning::MAGIRECO_VOICE_R2 is not bound; using the bounded fixed-origin HTTP fallback."
          fi

          cat > .wrangler-proofreading-bootstrap.jsonc <<EOF
          {
            "name": "$TEST_WORKER_NAME",
            "main": ".wrangler-proofreading-bootstrap.mjs",
            "compatibility_date": "2026-02-14",
            "workers_dev": true
          }
          EOF
          cat > .wrangler-proofreading-bootstrap.mjs <<'EOF'
          export default { fetch() { return new Response('Preparing proofreading deployment.'); } };
          EOF

          cat > .wrangler-proofreading-test.jsonc <<EOF
          {
            "\$schema": "node_modules/wrangler/config-schema.json",
            "name": "$TEST_WORKER_NAME",
            "main": ".open-next/worker.js",
            "compatibility_date": "2026-02-14",
            "compatibility_flags": ["nodejs_compat", "global_fetch_strictly_public"],
            "workers_dev": true,
            "assets": { "directory": ".open-next/assets", "binding": "ASSETS" },
            "services": [
              { "binding": "WORKER_SELF_REFERENCE", "service": "$TEST_WORKER_NAME" }
            ],
            "kv_namespaces": [
              { "binding": "SUBMISSIONS_KV", "id": "$KV_NAMESPACE_ID" }
            ],
          $voice_r2_config
            "vars": {
              "TURNSTILE_SITE_KEY": "$TURNSTILE_SITE_KEY",
              "TURNSTILE_ALLOWED_HOSTNAMES": "$TEST_WORKER_HOSTNAME",
              "PROOFREADING_TARGET_BRANCH": "EXEDRA-TEST",
              "PROOFREADING_SOURCE_COMMIT": "$SOURCE_COMMIT",
              "PROOFREADING_GITHUB_REPO": "${{ github.repository }}",
              "PROOFREADING_ALLOW_GITHUB_ADMIN": "true",
              "PROOFREADING_TURNSTILE_TEST_MODE": "$TURNSTILE_TEST_MODE"
            }
          }
          EOF

      - name: Create isolated Worker service shell
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --config .wrangler-proofreading-bootstrap.jsonc

      - name: Configure Turnstile Worker secret
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TURNSTILE_SECRET: ${{ env.TURNSTILE_SECRET_KEY_VALUE }}
        shell: bash
        run: >-
          printf '%s' "$TURNSTILE_SECRET" |
          npx wrangler secret put TURNSTILE_SECRET_KEY
          --config .wrangler-proofreading-test.jsonc

      - name: Configure optional server-side GitHub token
        if: env.SERVER_GITHUB_TOKEN != ''
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROOFREADING_GITHUB_TOKEN: ${{ env.SERVER_GITHUB_TOKEN }}
        shell: bash
        run: >-
          printf '%s' "$PROOFREADING_GITHUB_TOKEN" |
          npx wrangler secret put PROOFREADING_GITHUB_TOKEN
          --config .wrangler-proofreading-test.jsonc

      - name: Configure optional shared admin token
        if: env.SHARED_ADMIN_TOKEN != ''
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SUBMISSIONS_ADMIN_TOKEN: ${{ env.SHARED_ADMIN_TOKEN }}
        shell: bash
        run: >-
          printf '%s' "$SUBMISSIONS_ADMIN_TOKEN" |
          npx wrangler secret put SUBMISSIONS_ADMIN_TOKEN
          --config .wrangler-proofreading-test.jsonc

      - name: Deploy complete proofreading site
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy --config .wrangler-proofreading-test.jsonc

      - name: Smoke-test deployed split-search chunks
        env:
          SITE_URL: https://${{ env.TEST_WORKER_HOSTNAME }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/search_chunk_delivery.py verify-http --base-url "$SITE_URL"

      - name: Smoke-test deployed revision and official TW story bytes
        env:
          SITE_URL: https://${{ env.TEST_WORKER_HOSTNAME }}
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 30); do
            home_code="$(curl -L --silent --show-error -o "$RUNNER_TEMP/home.html" -w '%{http_code}' "$SITE_URL/?__revision=${GITHUB_SHA}-${attempt}" || true)"
            config_code="$(curl -L --silent --show-error -o "$RUNNER_TEMP/config.json" -w '%{http_code}' "$SITE_URL/api/proofreading/config?__revision=${GITHUB_SHA}-${attempt}" || true)"
            if [ "$home_code" = 200 ] && [ "$config_code" = 200 ]; then
              if python3 - "$RUNNER_TEMP/config.json" "$GITHUB_SHA" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          if value.get('target_branch') != 'EXEDRA-TEST':
              raise SystemExit(1)
          if value.get('source_revision') != sys.argv[2]:
              raise SystemExit(1)
          PY
              then
                ready=true
                break
              fi
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            echo "Deployed Worker did not expose the expected EXEDRA-TEST revision." >&2
            exit 1
          fi

          sample_path="$(python3 - <<'PY'
          import json
          from pathlib import Path
          stories = json.loads(Path('website/public/story_index.json').read_text(encoding='utf-8'))
          public = Path('website/public')
          for story in stories:
              if not isinstance(story, dict) or story.get('official_tw') is not True:
                  continue
              path = story.get('path_cn')
              if isinstance(path, str) and path.startswith('/data/') and (public / path.lstrip('/')).is_file():
                  print(path)
                  break
          else:
              raise SystemExit('No official TW public TXT sample was found')
          PY
          )"
          local_sample="website/public/${sample_path#/}"
          remote_sample="$RUNNER_TEMP/tw-sample.txt"
          curl --fail --location --silent --show-error \
            -o "$remote_sample" \
            "$SITE_URL$sample_path?__revision=$GITHUB_SHA"
          test "$(sha256sum "$local_sample" | awk '{print $1}')" = \
               "$(sha256sum "$remote_sample" | awk '{print $1}')"
          echo "TW_DEPLOY_BYTES_OK revision=$GITHUB_SHA path=$sample_path"

      - name: Smoke-test bounded voice playback assets
        env:
          SITE_URL: https://${{ env.TEST_WORKER_HOSTNAME }}
        shell: bash
        run: |
          set -euo pipefail
          site_url="$SITE_URL"
          headers="$RUNNER_TEMP/voice-headers.txt"
          voice_code="$(curl -L --silent --show-error \
            -H "Origin: $site_url" \
            -H 'Range: bytes=0-1023' \
            -D "$headers" -o "$RUNNER_TEMP/voice.bin" -w '%{http_code}' \
            "$site_url/api/audio/magireco-voice/vo_char_3031_00_01" || true)"
          if [ "$voice_code" != 200 ] && [ "$voice_code" != 206 ]; then
            echo "Magia Record voice endpoint returned $voice_code" >&2
            exit 1
          fi
          grep -qi 'access-control-allow-origin' "$headers"
          curl --fail --location --silent --show-error \
            -o "$RUNNER_TEMP/exedra.ogg" \
            "$site_url/audio/exedra-local/cv_namae_call_01.ogg"
          curl --fail --location --silent --show-error \
            -o "$RUNNER_TEMP/hca.wasm" \
            "$site_url/audio/hca_wasm_bg.wasm"
          test -s "$RUNNER_TEMP/exedra.ogg"
          test -s "$RUNNER_TEMP/hca.wasm"
          echo "VOICE_ASSETS_OK"

# TW_SIMPLIFIED_SEARCH_ATOMIC_DEPLOY_V4
