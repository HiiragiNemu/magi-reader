name: Export current manual-retranslation state

on:
  push:
    branches:
      - reader/manual-gpt-retranslation-20260816
    paths:
      - .translation-export-trigger/current-retranslation-state.txt
      - .github/workflows/export-current-retranslation-state.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Build compact state archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/current-state"
          cp -a magireco-translate-data-master/Scenarios_full "$RUNNER_TEMP/current-state/Scenarios_full"
          cp -a manual_retranslation "$RUNNER_TEMP/current-state/manual_retranslation"
          git rev-parse HEAD > "$RUNNER_TEMP/current-state/BRANCH_HEAD.txt"
          tar -C "$RUNNER_TEMP/current-state" -czf "$RUNNER_TEMP/current-retranslation-state.tar.gz" .
          sha256sum "$RUNNER_TEMP/current-retranslation-state.tar.gz" > "$RUNNER_TEMP/current-retranslation-state.tar.gz.sha256"

      - name: Upload current state
        uses: actions/upload-artifact@v4
        with:
          name: current-retranslation-state
          path: |
            ${{ runner.temp }}/current-retranslation-state.tar.gz
            ${{ runner.temp }}/current-retranslation-state.tar.gz.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
