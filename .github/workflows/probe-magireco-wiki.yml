name: Probe Magireco Wiki Endpoints

on:
  push:
    branches:
      - deploy/magireco-cn-reader
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe API and HTML endpoints
        shell: bash
        run: |
          set +e
          urls=(
            'https://magireco.moe/api.php?action=query&meta=siteinfo&format=json&formatversion=2'
            'https://www.magireco.moe/api.php?action=query&meta=siteinfo&format=json&formatversion=2'
            'https://magireco.moe/w/api.php?action=query&meta=siteinfo&format=json&formatversion=2'
            'https://www.magireco.moe/w/api.php?action=query&meta=siteinfo&format=json&formatversion=2'
            'https://magireco.moe/wiki/%E9%A6%96%E9%A1%B5'
            'https://magireco.moe/index.php?title=Special:Export&pages=%E9%A6%96%E9%A1%B5'
            'https://magireco.moe/index.php?title=Special:AllPages'
            'https://magireco.moe/sitemap.xml'
            'https://magireco.moe/robots.txt'
          )
          for url in "${urls[@]}"; do
            echo
            echo "=============================="
            echo "$url"
            curl --compressed --location \
              --max-time 45 \
              --connect-timeout 15 \
              --dump-header /tmp/headers \
              --output /tmp/body \
              --write-out 'curl_exit=%{exitcode} http=%{http_code} remote=%{remote_ip} content_type=%{content_type} redirect=%{redirect_url}\n' \
              --header 'Accept: application/json,text/html,application/xhtml+xml,*/*' \
              --header 'Accept-Language: zh-CN,zh;q=0.9,en;q=0.5' \
              --header 'Referer: https://magireco.moe/' \
              --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/138.0 Safari/537.36' \
              "$url"
            echo '--- headers ---'
            sed -n '1,30p' /tmp/headers
            echo '--- body type/size ---'
            file /tmp/body
            wc -c /tmp/body
            echo '--- body preview ---'
            head -c 800 /tmp/body
            echo
          done
          exit 0
