name: Probe Magireco Wiki Endpoints

on:
  push:
    branches: [deploy/magireco-cn-reader]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test current GITHUB_TOKEN against private build repository
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          set +e
          url="https://x-access-token:${TOKEN}@github.com/HiiragiNemu/magireco-wiki-data.git"
          GIT_TERMINAL_PROMPT=0 git ls-remote "$url" HEAD > /tmp/private-head 2> /tmp/private-error
          status=$?
          echo "private_repo_ls_remote_status=$status"
          sed -E 's#x-access-token:[^@]+@#x-access-token:***@#g' /tmp/private-error
          cat /tmp/private-head
          exit $status
