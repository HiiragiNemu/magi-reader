name: Probe Magireco Wiki Endpoints

on:
  push:
    branches: [deploy/magireco-cn-reader]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect proof cookie and alternate API methods
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/138.0 Safari/537.36'
          jar=/tmp/cookies
          nonce="$(date +%s)-$RANDOM"
          home="https://magireco.moe/index.php?title=%E9%A6%96%E9%A1%B5&proof=$nonce"
          api='https://magireco.moe/api.php'
          query='action=query&meta=siteinfo&siprop=general%7Cstatistics&format=json&formatversion=2'
          curl -L -sS --compressed -c "$jar" -b "$jar" -A "$ua" -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o /tmp/home "$home"
          echo 'cookie rows (domain, path, secure, expiry, name, value-length):'
          awk 'BEGIN{FS="\t"} !/^#/ && NF>=7 {print $1, $3, $4, $5, $6, length($7)}' "$jar"
          forced=$(awk 'BEGIN{FS="\t"} !/^#/ && NF>=7 {printf "%s%s=%s", sep,$6,$7; sep="; "}' "$jar")
          echo "forced_cookie_length=${#forced}"
          for mode in get forced post; do
            case "$mode" in
              get) args=(-G --data "$query" -b "$jar" -c "$jar") ;;
              forced) args=(-G --data "$query" -H "Cookie: $forced") ;;
              post) args=(-X POST --data "$query" -H "Cookie: $forced" -H 'Content-Type: application/x-www-form-urlencoded') ;;
            esac
            status=$(curl -L -sS --compressed -A "$ua" -H 'Accept: application/json' -e "$home" -o "/tmp/$mode" -w '%{http_code}' "${args[@]}" "$api")
            echo "$mode status=$status bytes=$(wc -c <"/tmp/$mode") preview=$(head -c 240 "/tmp/$mode" | tr '\n' ' ')"
          done
          export_status=$(curl -L -sS --compressed -A "$ua" -H "Cookie: $forced" -e "$home" -o /tmp/export -w '%{http_code}' 'https://magireco.moe/index.php?title=Special:Export&pages=%E9%A6%96%E9%A1%B5')
          echo "export status=$export_status bytes=$(wc -c </tmp/export) preview=$(head -c 300 /tmp/export | tr '\n' ' ')"
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('get', 'forced', 'post'):
              try:
                  data = json.loads(Path('/tmp/' + name).read_text(encoding='utf-8-sig'))
                  site = data.get('query', {}).get('general', {}).get('sitename')
                  if site:
                      print('SUCCESS', name, site)
                      raise SystemExit(0)
              except Exception:
                  pass
          raise SystemExit('no API method returned siteinfo')
          PY
