name: Probe Magireco Wiki Endpoints

on:
  push:
    branches: [deploy/magireco-cn-reader]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Force uncached homepage proof then request API
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/138.0 Safari/537.36'
          jar=/tmp/cookies
          nonce="$(date +%s)-$RANDOM"
          home="https://magireco.moe/index.php?title=%E9%A6%96%E9%A1%B5&proof=$nonce"
          api='https://magireco.moe/api.php?action=query&meta=siteinfo&siprop=general%7Cstatistics&format=json&formatversion=2'
          home_status=$(curl -L -sS --compressed -c "$jar" -b "$jar" -A "$ua" -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o /tmp/home -w '%{http_code}' "$home")
          api_status=$(curl -L -sS --compressed -c "$jar" -b "$jar" -A "$ua" -H 'Accept: application/json' -H 'Cache-Control: no-cache' -e "$home" -o /tmp/api -w '%{http_code}' "$api")
          echo "home_status=$home_status home_bytes=$(wc -c </tmp/home) api_status=$api_status api_bytes=$(wc -c </tmp/api) cookies=$(grep -vc '^#' "$jar" || true)"
          head -c 1600 /tmp/api
          echo
          python -c "import json; d=json.load(open('/tmp/api',encoding='utf-8-sig')); print(d.get('query',{}).get('general',{}).get('sitename')); assert d.get('query',{}).get('general',{}).get('sitename')"
