name: Audit Translation Release Trust Boundary

on:
  pull_request:
    branches:
      - tooling/repair-translation-release-base

permissions:
  contents: read

jobs:
  audit:
    if: >-
      github.event.pull_request.head.ref == 'tooling/repair-translation-release-run' &&
      github.event.pull_request.base.ref == 'tooling/repair-translation-release-base'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch trusted and current refs
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet .
          git remote add origin https://github.com/${{ github.repository }}.git
          git -c protocol.version=2 fetch --quiet --tags origin \
            main \
            EXEDRA-TEST \
            tooling/repair-translation-release-base
          git checkout --quiet origin/tooling/repair-translation-release-base -- \
            scripts/audit_translation_release.py

      - name: Download existing release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          gh release download translation-test-2026-07-27 \
            --repo "${{ github.repository }}" \
            --pattern 'magireco-translation-test-2026-07-27-v1.zip' \
            --dir "$RUNNER_TEMP/release"

      - name: Print concise trust audit
        shell: bash
        run: >-
          python3 scripts/audit_translation_release.py
          "$RUNNER_TEMP/release/magireco-translation-test-2026-07-27-v1.zip"
