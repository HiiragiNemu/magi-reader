name: Test Magireco Structured Reader v5

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki-preservation/tests/production-structured-v5.mjs'
      - 'wiki-preservation/static/structured-ui.js'
      - 'wiki-preservation/static/structured-ui.css'
      - 'wiki-preservation/scripts/extract_structured_characters.py'
      - 'wiki-preservation/scripts/patch_structured_runtime.py'
      - '.github/workflows/deploy-magireco-ui-hotfix.yml'
      - '.github/workflows/test-magireco-structured-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magireco-structured-v5-browser-test
  cancel-in-progress: true

jobs:
  mobile-structured-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out structured browser test
        uses: actions/checkout@v4
        with:
          sparse-checkout: wiki-preservation/tests/production-structured-v5.mjs
          sparse-checkout-cone-mode: true
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Prepare v5.2 production test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('wiki-preservation/tests/production-structured-v5.mjs').read_text(encoding='utf-8')
          source = source.replace('structured-ui.js?v=5.0', 'structured-ui.js?v=5.2&rev=5.2')
          source = source.replace(
              'health.uiVersion === 5 && health.counts?.pages === 500',
              "health.uiVersion === 5 && health.uiRevision === '5.2' && health.counts?.pages === 500",
          )
          target = Path('wiki-preservation/tests/production-structured-v5.2.mjs')
          target.write_text(source, encoding='utf-8')
          PY
          grep -q 'structured-ui.js?v=5.2&rev=5.2' wiki-preservation/tests/production-structured-v5.2.mjs
          grep -q "health.uiRevision === '5.2'" wiki-preservation/tests/production-structured-v5.2.mjs

      - name: Run structured character and voice production test
        run: node wiki-preservation/tests/production-structured-v5.2.mjs

      - name: Upload structured reader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magireco-structured-v5-mobile-evidence
          path: structured-v5-evidence
          if-no-files-found: warn
          retention-days: 14
