name: Publish simplified TW data

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export-exedra-baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Package Exedra source and translated JSON baselines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/exedra-baselines"
          cp -a magiraexedra-source-master/Scenarios_full "$RUNNER_TEMP/exedra-baselines/source"
          cp -a magiraexedra-translate-data-master/Scenarios_full "$RUNNER_TEMP/exedra-baselines/translated"
          find "$RUNNER_TEMP/exedra-baselines" -type f -name '*.json' | wc -l

      - name: Upload Exedra baselines for local diff
        uses: actions/upload-artifact@v4
        with:
          name: exedra-json-baselines-for-diff
          path: ${{ runner.temp }}/exedra-baselines
          compression-level: 6
          retention-days: 1
