name: Publish simplified TW data

on:
  push:
    branches:
      - release/zh-cn-tw-data-20260803

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and verify source release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-assets"
          gh release download latest \
            --pattern 'Scenarios.7z' \
            --pattern 'Manifests.7z' \
            --dir "$RUNNER_TEMP/source-assets" \
            --repo "$GITHUB_REPOSITORY"
          scenarios="$RUNNER_TEMP/source-assets/Scenarios.7z"
          manifests="$RUNNER_TEMP/source-assets/Manifests.7z"
          test "$(sha256sum "$scenarios" | cut -d' ' -f1)" = "698b4df4d3167602262f3a91e4ab0e82435a92a314b0f4e8af91ea4eb3bc9495"
          test "$(sha256sum "$manifests" | cut -d' ' -f1)" = "ab630d158c1edeb11107d0c23c11d4139c7ea4cf73fc4bc22dd37f6bc4da12ec"

      - name: Install conversion tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          python -m pip install --disable-pip-version-check opencc-python-reimplemented

      - name: Extract source scenarios and build inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-scenarios"
          7z x -y -o"$RUNNER_TEMP/source-scenarios" "$RUNNER_TEMP/source-assets/Scenarios.7z"
          python release-input/make_scenario_inventory.py \
            --root "$RUNNER_TEMP/source-scenarios" \
            --archive "$RUNNER_TEMP/source-assets/Scenarios.7z" \
            --out "$RUNNER_TEMP/scenario_inventory.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads((Path(os.environ['RUNNER_TEMP']) / 'scenario_inventory.json').read_text(encoding='utf-8'))
          assert p['schemaVersion'] == 2
          assert p['fileCount'] == 2780
          assert p['sourceArchiveSha256'] == '698b4df4d3167602262f3a91e4ab0e82435a92a314b0f4e8af91ea4eb3bc9495'
          PY

      - name: Build and validate Simplified Chinese assets
        shell: bash
        run: |
          set -euo pipefail
          python release-input/publish_release_assets.py \
            --repo "$GITHUB_WORKSPACE" \
            --inventory "$RUNNER_TEMP/scenario_inventory.json" \
            --manifests "$RUNNER_TEMP/source-assets/Manifests.7z" \
            --work "$RUNNER_TEMP/localization-work" \
            --out "$RUNNER_TEMP/release-assets"
          7z t "$RUNNER_TEMP/release-assets/Scenarios.7z"
          7z t "$RUNNER_TEMP/release-assets/Manifests.7z"

      - name: Update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          gh release upload latest \
            "$assets/Scenarios.7z" \
            "$assets/Manifests.7z" \
            "$assets/localization-report.json" \
            "$assets/SHA256SUMS.txt" \
            --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit latest \
            --title "Latest Data" \
            --notes-file "$assets/RELEASE_NOTES.md" \
            --latest --repo "$GITHUB_REPOSITORY"

      - name: Upload workflow audit artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: simplified-tw-data-audit
          path: |
            ${{ runner.temp }}/release-assets/localization-report.json
            ${{ runner.temp }}/release-assets/SHA256SUMS.txt
            ${{ runner.temp }}/release-assets/RELEASE_NOTES.md
          retention-days: 14

      - name: Record workflow result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -u
          python - <<'PY'
          import json, os
          from pathlib import Path
          target = Path('release-status/publish-simplified-tw-data.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          result = {
              'status': os.environ['JOB_STATUS'],
              'runId': int(os.environ['RUN_ID']),
              'runAttempt': int(os.environ['RUN_ATTEMPT']),
              'sourceCommit': os.environ['GITHUB_SHA'],
              'sourceScenariosSha256': '698b4df4d3167602262f3a91e4ab0e82435a92a314b0f4e8af91ea4eb3bc9495',
              'sourceManifestsSha256': 'ab630d158c1edeb11107d0c23c11d4139c7ea4cf73fc4bc22dd37f6bc4da12ec',
          }
          report = Path(os.environ['RUNNER_TEMP']) / 'release-assets' / 'localization-report.json'
          if report.exists():
              result['localizationReport'] = json.loads(report.read_text(encoding='utf-8'))
          target.write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release-status/publish-simplified-tw-data.json
          git commit -m "Record Simplified Chinese release workflow result" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
