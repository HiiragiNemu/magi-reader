name: Repair Authentic TW JSON and Canonical Exedra Speakers

on:
  push:
    branches: [EXEDRA-TEST]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-authentic-tw-exedra-test
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(
        github.event.head_commit.message,
        '[tw-status] Authentic TW repair bootstrap'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TW_SOURCE_URL: https://github.com/HiiragiNemu/MagiaExedraTWData/releases/download/tw-wiki-source-v1-20260806/exedra-tw-wiki-source-v1.zip
      TW_SOURCE_SHA256: 503c4c9a518d0a992abe800fccde4a97b35b2e4ddaeb2359e63eaa8d572cd1ac

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: EXEDRA-TEST

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Run complete fail-closed repair, validation and commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/run_authentic_tw_repair_v3.sh')
          source = path.read_text(encoding='utf-8')
          apply_marker = 'python tools/apply_authentic_tw_repair_v3.py\n'
          canonicalizer_marker = (
              'python tools/canonicalize_exedra_cn_speakers.py\n'
          )
          cleanup_marker = '  tools/apply_authentic_tw_repair_v3.py \\\n'
          if (
              source.count(apply_marker) != 1
              or source.count(canonicalizer_marker) != 1
              or source.count(cleanup_marker) != 1
          ):
              raise SystemExit('Repair runner insertion markers are not unique')
          source = source.replace(
              apply_marker,
              apply_marker
              + 'python tools/apply_authentic_tw_repair_v4.py\n'
              + 'python tools/apply_authentic_tw_repair_v5.py\n'
              + 'python tools/apply_authentic_tw_repair_v6.py\n'
              + 'python tools/apply_authentic_tw_repair_v8.py\n'
              + 'python tools/apply_authentic_tw_repair_v9.py\n'
              + 'python tools/apply_authentic_tw_repair_v10.py\n'
              + 'python tools/apply_authentic_tw_repair_v11.py\n'
              + 'python tools/apply_authentic_tw_repair_v16.py\n'
              + 'python tools/apply_authentic_tw_repair_v18.py\n'
              + 'python tools/apply_authentic_tw_repair_v22.py\n'
              + 'python tools/apply_authentic_tw_repair_v24.py\n'
              + 'python tools/apply_authentic_tw_repair_v25.py\n',
              1,
          )
          source = source.replace(
              canonicalizer_marker,
              canonicalizer_marker
              + 'python tools/derive_exedra_speaker_aliases.py\n'
              + 'python tools/finalize_exedra_cn_json_names.py\n'
              + 'python tools/certify_authentic_tw_reports.py\n'
              + 'python tools/audit_exedra_jp_speaker_dictionary.py\n',
              1,
          )
          source = source.replace(
              cleanup_marker,
              cleanup_marker
              + '  tools/apply_authentic_tw_repair_v4.py \\\n'
              + '  tools/apply_authentic_tw_repair_v5.py \\\n'
              + '  tools/apply_authentic_tw_repair_v6.py \\\n'
              + '  tools/apply_authentic_tw_repair_v8.py \\\n'
              + '  tools/apply_authentic_tw_repair_v9.py \\\n'
              + '  tools/apply_authentic_tw_repair_v10.py \\\n'
              + '  tools/apply_authentic_tw_repair_v11.py \\\n'
              + '  tools/apply_authentic_tw_repair_v12.py \\\n'
              + '  tools/apply_authentic_tw_repair_v13.py \\\n'
              + '  tools/apply_authentic_tw_repair_v16.py \\\n'
              + '  tools/apply_authentic_tw_repair_v18.py \\\n'
              + '  tools/apply_authentic_tw_repair_v22.py \\\n'
              + '  tools/apply_authentic_tw_repair_v24.py \\\n'
              + '  tools/apply_authentic_tw_repair_v25.py \\\n'
              + '  tools/finalize_exedra_cn_json_names.py \\\n',
              1,
          )
          path.write_text(source, encoding='utf-8', newline='\n')
          PY
          bash tools/run_authentic_tw_repair_v3.sh

# repair-bootstrap-v25-edit-speaker-roundtrip
