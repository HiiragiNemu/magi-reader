name: Repair Authentic TW JSON and Canonical Exedra Speakers

on:
  push:
    branches: [EXEDRA-TEST]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-authentic-tw-exedra-test
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(
        github.event.head_commit.message,
        '[tw-status] Authentic TW repair bootstrap'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TW_SOURCE_URL: https://github.com/HiiragiNemu/MagiaExedraTWData/releases/download/tw-wiki-source-v1-20260806/exedra-tw-wiki-source-v1.zip
      TW_SOURCE_SHA256: 503c4c9a518d0a992abe800fccde4a97b35b2e4ddaeb2359e63eaa8d572cd1ac

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: EXEDRA-TEST

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Run complete fail-closed repair, validation and commit
        shell: bash
        run: bash tools/run_authentic_tw_repair_v3.sh
