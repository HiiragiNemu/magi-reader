name: Cleanup accidental handoff aliases

on:
  push:
    branches:
      - feature/exedra-cn-and-magireco-voice
    paths:
      - .github/workflows/cleanup-accidental-handoff-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete exact accidental branch aliases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'feature/exedra-cn-and-magireco-voice-handoff'
            'feature/exedra-cn-and-magireco-voice-snapshot'
            'feature/exedra-cn-and-magireco-voice-finalhandoff'
            'feature/exedra-cn-and-magireco-voice-handoff-doc'
            'feature/exedra-cn-and-magireco-voice-handoff-summary'
            'feature/exedra-cn-and-magireco-voice-handoff-authoritative'
            'feature/exedra-cn-and-magireco-voice-handoff-latest'
            'feature/exedra-cn-and-magireco-voice-handoff-20260728'
          )
          for branch in "${branches[@]}"; do
            encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
            status="$(gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}" --include 2>&1 || true)"
            if grep -q 'HTTP/.* 204' <<<"$status"; then
              echo "deleted: $branch"
            elif grep -q 'HTTP/.* 422\|HTTP/.* 404' <<<"$status"; then
              echo "already absent: $branch"
            else
              printf '%s\n' "$status" >&2
              exit 1
            fi
          done
