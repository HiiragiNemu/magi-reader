name: Verify Private Magireco Data Access

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AUTO_TOKEN: ${{ github.token }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      MAGIRECO_REPO_TOKEN: ${{ secrets.MAGIRECO_REPO_TOKEN }}
      MAGIRECO_DATA_TOKEN: ${{ secrets.MAGIRECO_DATA_TOKEN }}
      REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
      PAT: ${{ secrets.PAT }}
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    steps:
      - name: Probe token names without exposing values
        shell: bash
        run: |
          set -euo pipefail
          repo='HiiragiNemu/magireco-wiki-data'
          mkdir -p result
          : > result/access.txt
          success=0
          for name in AUTO_TOKEN GH_PAT GITHUB_PAT PRIVATE_REPO_TOKEN MAGIRECO_REPO_TOKEN MAGIRECO_DATA_TOKEN REPO_TOKEN PAT PERSONAL_ACCESS_TOKEN; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              printf '%s\tabsent\n' "$name" | tee -a result/access.txt
              continue
            fi
            if GIT_TERMINAL_PROMPT=0 git ls-remote "https://x-access-token:${value}@github.com/${repo}.git" HEAD >/tmp/head 2>/tmp/error; then
              printf '%s\tpresent-and-authorized\t%s\n' "$name" "$(cut -f1 /tmp/head)" | tee -a result/access.txt
              success=1
            else
              printf '%s\tpresent-but-unauthorized\n' "$name" | tee -a result/access.txt
            fi
          done
          printf 'AUTHORIZED=%s\n' "$success" | tee -a result/access.txt

      - name: Upload access result
        uses: actions/upload-artifact@v4
        with:
          name: private-magireco-data-access-result
          path: result/access.txt
          retention-days: 3
